<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" font-family="-apple-system,'Helvetica Neue',Arial,'Hiragino Sans',Meiryo,sans-serif" role="img"><title>判定窓の上限は段ごとに違う</title><rect x="0" y="0" width="720" height="400" fill="#ffffff"/>
<text x="66.0" y="34.0" font-size="14.5" fill="#1c1c1c" text-anchor="start" font-weight="600">隣接段が触れ合う上限は段ごとに 3.5 倍違う</text>
<text x="66.0" y="53.0" font-size="11" fill="#767f89" text-anchor="start" font-weight="normal">窓を |比 / 予測 − 1| ≤ t と定義したとき、隣の段の窓と触れ合う t（諸元から算出）</text>
<line x1="66.0" y1="344.0" x2="520.0" y2="344.0" stroke="#808a94" stroke-width="1" stroke-opacity="0.18"/>
<text x="58.0" y="348.0" font-size="11.5" fill="#767f89" text-anchor="end" font-weight="normal">0</text>
<line x1="66.0" y1="283.1" x2="520.0" y2="283.1" stroke="#808a94" stroke-width="1" stroke-opacity="0.18"/>
<text x="58.0" y="287.1" font-size="11.5" fill="#767f89" text-anchor="end" font-weight="normal">5</text>
<line x1="66.0" y1="222.2" x2="520.0" y2="222.2" stroke="#808a94" stroke-width="1" stroke-opacity="0.18"/>
<text x="58.0" y="226.2" font-size="11.5" fill="#767f89" text-anchor="end" font-weight="normal">10</text>
<line x1="66.0" y1="161.3" x2="520.0" y2="161.3" stroke="#808a94" stroke-width="1" stroke-opacity="0.18"/>
<text x="58.0" y="165.3" font-size="11.5" fill="#767f89" text-anchor="end" font-weight="normal">15</text>
<line x1="66.0" y1="100.4" x2="520.0" y2="100.4" stroke="#808a94" stroke-width="1" stroke-opacity="0.18"/>
<text x="58.0" y="104.4" font-size="11.5" fill="#767f89" text-anchor="end" font-weight="normal">20</text>
<text x="17" y="210" font-size="12" fill="#767f89" text-anchor="middle" transform="rotate(-90 17 210)">触れ合う上限 [%]</text>
<rect x="87.8" y="93.3" width="47.2" height="250.7" fill="#2a78d6" opacity="0.75" rx="2"/>
<text x="111.4" y="85.3" font-size="11.5" fill="#2a78d6" text-anchor="middle" font-weight="700">20.58</text>
<text x="111.4" y="362.0" font-size="11.5" fill="#767f89" text-anchor="middle" font-weight="normal">1-2速</text>
<rect x="178.6" y="156.6" width="47.2" height="187.4" fill="#eb6834" opacity="0.75" rx="2"/>
<text x="202.2" y="148.6" font-size="11.5" fill="#eb6834" text-anchor="middle" font-weight="700">15.38</text>
<text x="202.2" y="362.0" font-size="11.5" fill="#767f89" text-anchor="middle" font-weight="normal">2-3速</text>
<rect x="269.4" y="222.2" width="47.2" height="121.8" fill="#1baf7a" opacity="0.75" rx="2"/>
<text x="293.0" y="214.2" font-size="11.5" fill="#1baf7a" text-anchor="middle" font-weight="700">10.00</text>
<text x="293.0" y="362.0" font-size="11.5" fill="#767f89" text-anchor="middle" font-weight="normal">3-4速</text>
<rect x="360.2" y="254.9" width="47.2" height="89.1" fill="#eda100" opacity="0.75" rx="2"/>
<text x="383.8" y="246.9" font-size="11.5" fill="#eda100" text-anchor="middle" font-weight="700">7.31</text>
<text x="383.8" y="362.0" font-size="11.5" fill="#767f89" text-anchor="middle" font-weight="normal">4-5速</text>
<rect x="451.0" y="273.3" width="47.2" height="70.7" fill="#e87ba4" opacity="0.75" rx="2"/>
<text x="474.6" y="265.3" font-size="11.5" fill="#e87ba4" text-anchor="middle" font-weight="700">5.81</text>
<text x="474.6" y="362.0" font-size="11.5" fill="#767f89" text-anchor="middle" font-weight="normal">5-6速</text>
<line x1="66.0" y1="295.3" x2="520.0" y2="295.3" stroke="#1c1c1c" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="72.0" y="288.3" font-size="11" fill="#1c1c1c" text-anchor="start" font-weight="600">一律に 4.0% を使った場合</text>
<text x="536.0" y="86.0" font-size="10.5" fill="#767f89" text-anchor="start" font-weight="normal">一律 4.0% は、</text>
<text x="536.0" y="100.0" font-size="10.5" fill="#767f89" text-anchor="start" font-weight="normal">5-6速では上限の 69% を</text>
<text x="536.0" y="114.0" font-size="10.5" fill="#767f89" text-anchor="start" font-weight="normal">許すのに、</text>
<text x="536.0" y="128.0" font-size="10.5" fill="#767f89" text-anchor="start" font-weight="normal">1-2速では 19% しか</text>
<text x="536.0" y="142.0" font-size="10.5" fill="#767f89" text-anchor="start" font-weight="normal">許さない。</text>
<text x="536.0" y="170.0" font-size="10.5" fill="#767f89" text-anchor="start" font-weight="normal">最も余裕のある低速段で</text>
<text x="536.0" y="184.0" font-size="10.5" fill="#767f89" text-anchor="start" font-weight="600">最も厳しく切っていた。</text>
<text x="536.0" y="212.0" font-size="10.5" fill="#767f89" text-anchor="start" font-weight="normal">そこで「境界までの</text>
<text x="536.0" y="226.0" font-size="10.5" fill="#767f89" text-anchor="start" font-weight="600">何割か」を一定にする。</text>
<text x="536.0" y="254.0" font-size="10.5" fill="#767f89" text-anchor="start" font-weight="normal">実測 12 本 28,967 行で</text>
<text x="536.0" y="268.0" font-size="10.5" fill="#767f89" text-anchor="start" font-weight="600">確定 94.0% → 98.1%。</text>
<text x="536.0" y="282.0" font-size="10.5" fill="#767f89" text-anchor="start" font-weight="normal">割り当ては 1 つも</text>
<text x="536.0" y="296.0" font-size="10.5" fill="#767f89" text-anchor="start" font-weight="normal">変わらない。</text>
</svg>