<text x="66.0" y="34.0" font-size="14.5" fill="#1c1c1c" text-anchor="start" font-weight="600">0D は四捨五入ではなく切り捨て</text>
<text x="66.0" y="53.0" font-size="11" fill="#767f89" text-anchor="start" font-weight="normal">段ごとに独立にスケール係数を当てる。剛体連結なら全段同一のはず（ELM327 実走 n=28,941）</text>
