<line x1="526.0" y1="78.0" x2="546.0" y2="78.0" stroke="#c2410c" stroke-width="3.2"/>
<text x="553.0" y="82.0" font-size="12" fill="#c2410c" text-anchor="start" font-weight="600">生値</text>
<text x="534.0" y="100.0" font-size="11.5" fill="#c2410c" text-anchor="start" font-weight="normal">ばらつき 0.53%</text>
<line x1="526.0" y1="122.0" x2="546.0" y2="122.0" stroke="#1baf7a" stroke-width="3.2"/>
<text x="553.0" y="126.0" font-size="12" fill="#1baf7a" text-anchor="start" font-weight="600">車速 + 0.5</text>
<text x="534.0" y="144.0" font-size="11.5" fill="#1baf7a" text-anchor="start" font-weight="normal">ばらつき 0.07%</text>
<text x="526.0" y="170.0" font-size="10.5" fill="#767f89" text-anchor="start" font-weight="normal">生値では 2 速から上が</text>
<text x="526.0" y="184.0" font-size="10.5" fill="#767f89" text-anchor="start" font-weight="normal">段ごとに単調に下がる。</text>
<text x="526.0" y="198.0" font-size="10.5" fill="#767f89" text-anchor="start" font-weight="normal">剛体で連結されている</text>
<text x="526.0" y="212.0" font-size="10.5" fill="#767f89" text-anchor="start" font-weight="normal">以上、全段同一でなければ</text>
<text x="526.0" y="226.0" font-size="10.5" fill="#767f89" text-anchor="start" font-weight="normal">ならない。</text>
<text x="526.0" y="254.0" font-size="10.5" fill="#767f89" text-anchor="start" font-weight="normal">車速に +0.5 を戻すと</text>
<text x="526.0" y="268.0" font-size="10.5" fill="#767f89" text-anchor="start" font-weight="600">ばらつきが 1 桁潰れる。</text>
<text x="526.0" y="296.0" font-size="10.5" fill="#767f89" text-anchor="start" font-weight="normal">切り捨てだから、真値は</text>
<text x="526.0" y="310.0" font-size="10.5" fill="#767f89" text-anchor="start" font-weight="600">区間の中央にある。</text>
