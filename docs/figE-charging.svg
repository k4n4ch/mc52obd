<text x="638.0" y="86.0" font-size="11" fill="#767f89" text-anchor="start" font-weight="normal">帯は 5–95%、線は中央値</text>
<line x1="638.0" y1="108.0" x2="658.0" y2="108.0" stroke="#c2410c" stroke-width="3"/>
<text x="664.0" y="112.0" font-size="11.5" fill="#c2410c" text-anchor="start" font-weight="600">旧バッテリー</text>
<text x="646.0" y="128.0" font-size="10.5" fill="#767f89" text-anchor="start" font-weight="normal">n = 15,162</text>
<text x="646.0" y="144.0" font-size="12" fill="#c2410c" text-anchor="start" font-weight="700">15V 超  10.23%</text>
<line x1="638.0" y1="164.0" x2="658.0" y2="164.0" stroke="#1baf7a" stroke-width="3"/>
<text x="664.0" y="168.0" font-size="11.5" fill="#1baf7a" text-anchor="start" font-weight="600">新バッテリー</text>
<text x="646.0" y="184.0" font-size="10.5" fill="#767f89" text-anchor="start" font-weight="normal">n = 19,406</text>
<text x="646.0" y="200.0" font-size="12" fill="#1baf7a" text-anchor="start" font-weight="700">15V 超  0.00%</text>
<text x="638.0" y="224.0" font-size="10.5" fill="#767f89" text-anchor="start" font-weight="normal">回転を上げても上がらない。</text>
<text x="638.0" y="238.0" font-size="10.5" fill="#767f89" text-anchor="start" font-weight="normal">アイドルから既にレギュ</text>
<text x="638.0" y="252.0" font-size="10.5" fill="#767f89" text-anchor="start" font-weight="normal">レータがクランプしている</text>
<text x="638.0" y="266.0" font-size="10.5" fill="#767f89" text-anchor="start" font-weight="600">＝発電は足りている。</text>
<text x="638.0" y="294.0" font-size="10.5" fill="#767f89" text-anchor="start" font-weight="normal">違いは中央値ではなく</text>
<text x="638.0" y="308.0" font-size="10.5" fill="#767f89" text-anchor="start" font-weight="normal">散らばりに出た。15V 超は</text>
<text x="638.0" y="322.0" font-size="10.5" fill="#767f89" text-anchor="start" font-weight="normal">弱ったバッテリーが充電</text>
<text x="638.0" y="336.0" font-size="10.5" fill="#767f89" text-anchor="start" font-weight="normal">電流を飲めない症状で、</text>
<text x="638.0" y="350.0" font-size="10.5" fill="#767f89" text-anchor="start" font-weight="600">発電系の症状ではない。</text>
