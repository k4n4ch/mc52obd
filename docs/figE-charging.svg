<text x="60.0" y="498.0" font-size="11" fill="#767f89" text-anchor="start" font-weight="normal">回転を上げても電圧は上がらない。 アイドルの時点でレギュレータがクランプしており、発電は 1,400rpm で既に足りている。</text>
<text x="60.0" y="515.0" font-size="11" fill="#767f89" text-anchor="start" font-weight="normal">違いは中央値ではなく分布の形。 旧は 13.7V の主峰の上に 14.6〜15.5V の第二の山を持つ（約 19%）——ばらついたのではなく別の状態に入っていた。</text>
<text x="60.0" y="532.0" font-size="11" fill="#767f89" text-anchor="start" font-weight="normal">弱ったバッテリーは内部抵抗が上がって充電電流を飲めないため、レギュレータの出力が上へ振れる。発電系ではなくバッテリー側の症状。</text>
