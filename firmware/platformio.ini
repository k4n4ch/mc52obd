; MC52（CB250R 2018）K-Line ロガー — ブリングアップ用の最小構成
;
; 基板は mc52obd/hardware/。USB(IO19/20) は未接続なので、書き込みも
; シリアルも J3（圧入 5 極: GND / TXD0 / RXD0 / EN / IO0）から行う。
; USB-UART 変換を J3 に当て、DTR/RTS を EN/IO0 へ繋げば自動リセットが効く。

[common]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework  = arduino
board_build.partitions = partitions.csv
board_build.flash_size  = 16MB
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
monitor_speed = 115200
upload_speed  = 460800

; 机上確認用。バイクに繋がず、Mac だけで基板の健全性を測る。
; K ラインはボード上の R7（510Ω・VIN→KLINE）で 12V に吊られているので、
; J1 の KLINE を未接続のまま TX→K→RX の折り返しが閉じる。
[env:selftest]
extends = common
build_src_filter = +<selftest.cpp>
build_flags =
  -D ARDUINO_USB_CDC_ON_BOOT=0
  -D BOARD_HAS_PSRAM

; **探索フェーズ。停車・エンジン掛けで使う。**
; obd（標準層）と probe（独自層）を畳んだもの。現場で焼き直さずに往復できる
; ことが切り分けの速さに直結するため。コマンドは BLE から入り、J3 のシリアルは
; 逃げ道として残してある。任意バイト列と任意長ブレークを土台に置いてあるので、
; 仮説が外れても焼き直しが要らない。
[env:explore]
extends = common
build_src_filter = +<explore.cpp>
build_flags =
  -D ARDUINO_USB_CDC_ON_BOOT=0
  -D BOARD_HAS_PSRAM
