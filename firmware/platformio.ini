; MC52（CB250R 2018）K-Line ロガー — ブリングアップ用の最小構成
;
; 基板は mc52obd/hardware/。USB(IO19/20) は未接続なので、書き込みも
; シリアルも J3（圧入 5 極: GND / TXD0 / RXD0 / EN / IO0）から行う。
; USB-UART 変換を J3 に当て、DTR/RTS を EN/IO0 へ繋げば自動リセットが効く。

[common]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework  = arduino
board_build.partitions = partitions.csv
board_build.flash_size  = 16MB
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
monitor_speed = 115200
upload_speed  = 460800

[env:mc52]
extends = common
build_src_filter = +<main.cpp>
build_flags =
  ; **必須。** S3 の Arduino は既定で Serial を USB CDC に割り当てるが、
  ; この基板は USB が未接続なので UART0（IO43/IO44 = J3）へ固定する。
  ; これを 0 にしないとブリングアップ中に一切の出力が見えない。
  -D ARDUINO_USB_CDC_ON_BOOT=0
  -D BOARD_HAS_PSRAM

; 机上確認用。バイクに繋がず、Mac だけで基板の健全性を測る。
; K ラインはボード上の R7（510Ω・VIN→KLINE）で 12V に吊られているので、
; J1 の KLINE を未接続のまま TX→K→RX の折り返しが閉じる。
[env:selftest]
extends = common
build_src_filter = +<selftest.cpp>
build_flags =
  -D ARDUINO_USB_CDC_ON_BOOT=0
  -D BOARD_HAS_PSRAM
