<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MC52 走行ログビュワー</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
/* ══ 配色 ══════════════════════════════════════════════════
 * ギヤは 6 色で塗り分ける。当初は順序尺度として単一色相の逐次ランプを使い
 * validator も通していたが、実データでは青系が並んで判別できなかったため、
 * 実用を優先してカテゴリカルへ切り替えた。
 *
 * 地図の線は暗いケーシングの上に乗せる。OSM タイル(#f2efe9 前後)に直接置くと
 * 明るい色がコントラスト floor を割るため、隣接面をケーシングにする。
 * ══════════════════════════════════════════════════════════ */
:root{
  --bg:#07090d; --panel:#11151c; --line:#232b38;
  --fg:#e8eef7; --dim:#7d8899; --mute:#5b6472; --accent:#3987e5;
  --warn:#ffb020; --bad:#ff4d5e;
  --casing:#2b2a27;
  /* ギヤは 6 色で塗り分ける。skill の推奨順（slot 1-6）をそのまま使う。
   * この順は**隣接ペアの分離**に最適化されており、ギヤは隣り合う段が経路上でも
   * 隣接するのでその条件が効く（隣接 CVD ΔE 9.1）。
   * 既知の弱点は 2速(橙) と 4速(黄) で、全ペア条件では通常視 ΔE 13.7 と floor を
   * 割る。凡例に数字を併記して色だけに頼らせないことで補う。 */
  --g1:#2a78d6; --g2:#eb6834; --g3:#1baf7a;
  --g4:#eda100; --g5:#e87ba4; --g6:#008300;
  --gx:#8b8b86;          /* 不確定・ニュートラル。ランプ外の中立色 */
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--fg); overflow:hidden;
  font-family:-apple-system,"Helvetica Neue",Roboto,sans-serif;
  font-variant-numeric:tabular-nums; -webkit-text-size-adjust:100%;
  display:flex; flex-direction:column;
}

/* ── 操作列（フィルタはチャート上の 1 行にまとめる） ── */
#bar{flex:0 0 auto; display:flex; flex-wrap:wrap; gap:.5rem; align-items:center;
     padding:.45rem .6rem; background:var(--panel); border-bottom:1px solid var(--line);
     font-size:.75rem}
#bar label{display:flex; align-items:center; gap:.3rem; color:var(--dim)}
/* ⚙ の位置だけ右端に固定し、余りは全部ファイル名に使わせる。狭い画面では
   min-width:0 で縮むので ⚙ を次の行へ追い出さない（Chrome は入りきらない
   分を中略で詰める） */
input[type=file]{font:inherit; font-size:.72rem; color:var(--dim);
  flex:1 1 auto; min-width:0}
input[type=number]{font:inherit; width:4.4rem; background:#0c1016; color:var(--fg);
  border:1px solid var(--line); border-radius:.25rem; padding:.2rem .3rem}
/* 丁数は任意値でなく選択にする。非現実的な値を入れられないうえ、総当たりの
   探索範囲と UI の選択肢が同じ定義で揃う */
select{font:inherit; background:#0c1016; color:var(--fg); border:1px solid var(--line);
  border-radius:.25rem; padding:.2rem .15rem}
button{font:inherit; font-size:.72rem; font-weight:600; color:var(--fg); background:#161c25;
  border:1px solid var(--line); border-radius:.3rem; padding:.32rem .55rem; cursor:pointer}
button:active{background:#202834}
button:disabled{opacity:.35}
#tolMax{color:var(--mute)}
#opts{flex:0 0 auto; display:flex; flex-wrap:wrap; gap:.5rem; align-items:center;
      padding:.45rem .6rem; background:#0e131a; border-bottom:1px solid var(--line);
      font-size:.75rem}
#opts[hidden]{display:none}
#opts label{display:flex; align-items:center; gap:.3rem; color:var(--dim)}
#optBtn{margin-left:auto}
#optBtn.on{background:#25303f; border-color:var(--accent)}
/* 折り返しを許す。nowrap だと画面が狭いとき右端で見切れて、補完の結果など
   後ろに付く情報が読めなくなる */
#stat{color:var(--dim); font-size:.72rem; min-width:0}
#ver{color:var(--dim); font-size:.68rem; opacity:.65; white-space:nowrap}
#opts .info{flex:1 1 100%; display:flex; flex-wrap:wrap; gap:.5rem; align-items:baseline;
  padding-top:.35rem; border-top:1px solid var(--line)}
#cur{margin-left:auto; color:var(--warn); font-size:.68rem; white-space:nowrap;
  font-variant-numeric:tabular-nums}

/* ── 再生バー ── */
#play{flex:0 0 auto; display:flex; flex-wrap:wrap; gap:.3rem; align-items:center;
      padding:.35rem .45rem; background:var(--panel); border-bottom:1px solid var(--line)}
#play button{padding:.28rem .5rem}
#pSpd{display:flex; gap:.2rem; margin-left:.3rem}
#pSpd button{padding:.28rem .3rem; font-size:.7rem; color:var(--dim)}
#pSpd button.on{color:var(--fg); background:#25303f; border-color:var(--accent)}

/* ── 本体 ── */
#wrap{flex:1 1 auto; display:flex; min-height:0}
#map{flex:1 1 60%; min-height:0; background:#1a1a19; position:relative; overflow:hidden}
#mapc{position:absolute; inset:0}
/* ナビ。内側を四方へ 21% 広げてから回すと、45 度でも角に隙間が出ない
   （対角は √2 = 1.414 倍。142% を確保する）。Leaflet は `.leaflet-map-pane` に
   transform を掛けて地図を動かすので、**回転はその外側のコンテナに掛ける**。 */
/* 毎フレーム内挿した方位を当てるので、CSS 側で更に補間すると二重になる */
#map.nav #mapc{inset:-21%}
#map.nav .leaflet-control-container{display:none}   /* 一緒に回るので自前に置き換える */
#navg, #navctl{display:none}
/* canvas は置換要素なので `inset:0` では伸びない（width:auto のとき固有幅
   300x150 が優先され right/bottom は無視される）。実寸を明示する。 */
#map.nav #navg{display:block; position:absolute; left:0; top:0; width:100%; height:100%;
  pointer-events:none; z-index:450}
/* ゲージは下の両隅に置くので、コントロールは右上へ逃がす（画面が低いと左上では
   回転数ゲージと重なる） */
#map.nav #navctl{display:flex; position:absolute; right:.6rem; top:.6rem; z-index:500;
  flex-direction:column; gap:.3rem}
#navctl button{width:1.9rem; height:1.9rem; padding:0; font-size:.85rem;
  background:rgba(20,24,31,.82); border-color:rgba(255,255,255,.25); color:#fff}
#pNav.on{background:#25303f; border-color:var(--accent)}
#side{flex:1 1 40%; min-width:0; overflow-y:auto; border-left:1px solid var(--line);
      padding:.4rem; display:flex; flex-direction:column; gap:.4rem}
@media (max-width:900px){
  #wrap{flex-direction:column}
  #map{flex:0 0 45vh}
  #side{flex:1 1 auto; border-left:0; border-top:1px solid var(--line)}
}

/* ── チャート ── */
.chart{background:var(--panel); border:1px solid var(--line); border-radius:.4rem;
       padding:.3rem .4rem .1rem}
.chart h3{font-size:.68rem; font-weight:600; color:var(--dim); letter-spacing:.08em;
          display:flex; justify-content:space-between; align-items:baseline}
.chart h3 span{color:var(--fg); font-size:.82rem; font-weight:700}
/* 縦方向のスクロールはブラウザに渡し、横方向のドラッグだけをスクラブに使う。
 * touch-action:none にすると縦スクロールまで奪われ、6 枚を積んだ側が
 * 事実上スクロールできなくなる。 */
.chart canvas{width:100%; height:74px; display:block; touch-action:pan-y}

/* ── 凡例（地図の上。ギヤは色だけに頼らないよう数字も入れる） ── */
/* ズームの下に並べる。文字ボタンなので既定の正方形より広げる。
   Leaflet の `.leaflet-touch .leaflet-bar a` が詳細度 (0,0,3,1) で width を
   固定してくるので、こちらもクラスを重ねて上回る必要がある。 */
.leaflet-touch .leaflet-bar.fitctl a, .leaflet-bar.fitctl a{
  width:auto; min-width:2.8rem; height:1.7rem; line-height:1.7rem;
  padding:0 .35rem; font-size:.72rem; font-weight:600; white-space:nowrap}
.leaflet-control.legend{
  background:rgba(252,252,251,.94); color:#0b0b0b; padding:.4rem .5rem;
  border-radius:.35rem; font-size:.68rem; line-height:1.5;
  box-shadow:0 1px 5px rgba(0,0,0,.4)}
.legend b{display:block; font-size:.64rem; color:#52514e; font-weight:600;
          letter-spacing:.06em; margin-bottom:.25rem}
.legend .row{display:flex; align-items:center; gap:.28rem; flex-wrap:wrap}
.legend .sw{width:1.15rem; height:.42rem; border-radius:999px;
            outline:1.5px solid var(--casing); outline-offset:0}
.legend .gsel{display:inline-flex; align-items:center; gap:.15rem; cursor:pointer;
  padding:.1rem .2rem; border-radius:.2rem; border:1px solid transparent}
.legend .gsel:hover{background:rgba(0,0,0,.06)}
.legend .gsel.on{background:#0b0b0b; color:#fff; border-color:#0b0b0b}
.legend .wd{display:flex; align-items:center; gap:.3rem; margin-top:.3rem}
.legend .wd i{display:block; background:#52514e; border-radius:999px}

#empty{position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
       text-align:center; color:var(--dim); font-size:.85rem; padding:2rem; pointer-events:none}
#empty.hide{display:none}
</style>

<div id="bar">
  <input type="file" id="file" accept=".csv,text/csv">
  <button id="optBtn" title="判定の係数と丁数の設定、読み込んだログの診断">⚙ 設定</button>
</div>

<!-- 走行を見るあいだは触らない設定。既定では畳んで地図と時系列に高さを譲る -->
<div id="opts" hidden>
  <span id="kdiag" title="k は車速信号の経路だけで決まる閉じた定数で、車両ごとの較正を要しない。このログから当てた値を併記するので、外れていれば前提の崩れに気づける">k —</span>
  <label title="隣接する段の窓が重ならない上限まで。上限は諸元から算出している">窓±
    <input type="number" id="tol" step="0.5" min="0.5" value="4">% <span id="tolMax"></span></label>
  <label title="回転数を車速の取得時刻へ補間して揃える"><input type="checkbox" id="align" checked> 時刻補正</label>
  <label title="ECU は純正 14T/36T 前提で換算する。後は 36T 固定（MC52 は他の設定が売られていない）。表示車速のみ補正し、ギヤ判定は生値で行う">前丁数
    <select id="sf"></select></label>
  <button id="estsp" disabled title="GPS 速度との一致から前後の丁数を推定する。速度比だけでは一意に決まらないため候補も出す">丁数推定</button>
  <button id="calsp" disabled title="表示車速が GPS と一致するよう校正トリムを求める。丁数比だけでは実測と 1% 弱ずれるため（ECU の想定円周と実際の転がり円周の差）。走行画面と共有する">車速校正</button>
  <!-- 行数・確定率・補完の結果は読み込み時に一度見れば足りる診断で、走行を
       見返すあいだは要らない。補完を採らなかった理由もここへ出る -->
  <div class="info"><span id="stat">CSV を読み込む</span><span id="ver"></span></div>
</div>

<div id="play">
  <button id="pPlay" disabled title="再生 / 一時停止">▶</button>
  <button id="pBack" disabled title="5 秒戻す">⏪5s</button>
  <button id="pFwd" disabled title="10 秒送る">10s⏩</button>
  <span id="pSpd"></span>
  <button id="pNav" disabled title="進行方向を上にして自車を中心に固定する。回転数・車速・ギヤを重ねて表示">ナビ</button>
  <!-- 位置と全長。倍率や送り戻しと同じ量を指しているので再生バーに置く -->
  <span id="cur"></span>
</div>

<div id="wrap">
  <div id="map">
    <!-- Leaflet はこの内側に載せる。ナビでは #map からはみ出す大きさに広げ、
         はみ出しは #map の overflow:hidden で切る（回転で角が欠けないため） -->
    <div id="mapc"></div>
    <canvas id="navg"></canvas>
    <div id="navctl">
      <button id="nvIn"  title="拡大">＋</button>
      <button id="nvOut" title="縮小">−</button>
      <button id="nvOff" title="ナビモードを抜ける">✕</button>
    </div>
    <div id="empty">アプリが書き出した CSV を読み込むと、<br>経路と時系列を表示する</div>
  </div>
  <div id="side"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
'use strict';
const VERSION = 'v20260905a';

/* ══════════════════════════════════════════════════════════
 * MC52 走行ログビュワー
 *
 * index.html が書き出した CSV（OBD と GPS を時刻結合済み）を読み、
 *   ・地図: 経路を描く。線の太さ = 車速、線の色 = ギヤ
 *   ・チャート: 車速/ギヤ/回転数/スロットル/水温/電圧 を時系列で
 * 表示する。PC ブラウザと Android Chrome の双方で動く。
 *
 * ギヤは CSV に入っていないので、ここで rpm/車速比から求める。
 * 判定は tools/gearcal.py と同じ方式 —— 理論減速比を軸に、単一の
 * スケール係数 k だけを当てはめる。k はタイヤ外径・摩耗・空気圧・
 * 速度計の系統誤差をまとめて吸収する唯一の未知数。
 *
 * 依存は Leaflet のみで、それも地図だけ。**チャートは自前描画で
 * 依存ゼロ**にしてある。OSM タイルは通信が要るが、通信が無くても
 * ログの解析（チャート）は成立させたいため。
 * ══════════════════════════════════════════════════════════ */

// ── 車両諸元（Honda factbook 2018-03、2BK-MC52）────────────
const GEAR = {1:3.416, 2:2.250, 3:1.650, 4:1.350, 5:1.166, 6:1.038};
const PRIMARY = 2.807, SECONDARY = 2.571;
const TIRE_CIRC = Math.PI * (17*25.4 + 2*150*0.60) / 1000;   // 後輪 150/60R17 [m]

/** 理論 rpm/(km/h) 比。1速 213.8 … 6速 65.0 */
const R = {};
for (const n in GEAR) R[n] = PRIMARY * GEAR[n] * SECONDARY / (TIRE_CIRC * 60 / 1000);
const GEARS = [1,2,3,4,5,6];

/* ギヤ判定の k は**閉じた定数**であり、車両ごとの較正を要しない。
 * k = (この式に置いた円周 1.9220m) ÷ (ECU の係数が含意する円周) で、
 * 一次減速比・変速比は諸元、ECU 係数はファーム定数。車速センサはファイナルより
 * 上流なので前後スプロケも効かず、ECU は固定係数なので実タイヤ・空気圧・摩耗も
 * 効かない。較正すべき自由度が存在しない。
 * 実測（5 走行 n=1554）: 新 3 本 1.0055/1.0057/1.0064（幅 0.09%）、
 * 旧 2 本は時刻ズレ未修正で 1.0036/1.0084。判定窓 4% に対し桁違いに小さい。 */
/* `0D` は切り捨てなので真値は n+0.5。**n = 0 のときだけ補正しない。**
 * 区間 [0,1) は真の停止を含み、停止は他から明らかに分かる。補正すると停車中の
 * 表示が 1km/h に張り付く。 */
const spdTrue = v => v == null ? null : (v === 0 ? 0 : v + 0.5);
const GEAR_K = 1.0057;
const GEAR_RPM_MIN = 1700;   // アイドル(約1500)と1速の下限(1828)の間

/* 判定窓の上限は諸元から決まる。窓を |比/予測 - 1| ≤ t と定義しているので、
 * 隣接する 2 段の窓が重ならない条件は
 *     r_a(1-t) > r_b(1+t)   →   t < (s-1)/(s+1),  s = r_a/r_b
 * 全段に同じ窓を使うため、最も狭い 5-6速（s=1.1233）が上限を決めて 5.81%。
 * これを超えると隣の段の領域に食い込み、判定が原理的に破綻する。
 * 諸元から算出しているので、車種を変えても手で直す必要は無い。
 * 実際の窓にはこれに加えて車速の量子化ぶん 0.5/車速 が乗る（assignGears）。 */
const TOL_MAX = Math.min(...GEARS.slice(0, -1).map(n => {
  const s = R[n] / R[n + 1];
  return (s - 1) / (s + 1) * 100;
}));

const GCOL = {1:'--g1',2:'--g2',3:'--g3',4:'--g4',5:'--g5',6:'--g6'};

let isolate = null;   // null=全ギヤ表示、1-6=そのギヤだけ強調

/* ── 表示車速のスプロケット補正 ────────────────────────────
 * ビュワーが読むのは `speed_obd` = ECU の生値で、ECU は純正 14T/36T を固定
 * 前提に換算している。前スプロケットを替えると真の車速からずれる。
 *   真の車速 = 0D × (前丁数 / 14)
 *
 * **後スプロケットは 36T 固定。** MC52 向けにサンスター RH-133 も NTB SPH-086R も
 * 36T（純正歯数）しか出しておらず、選択肢にする意味が無いため（2026-08 調べ）。
 *
 * **補正するのは表示だけ。** グラフ・カーソル値・線の太さの区分には掛けるが、
 * **ギヤ判定には掛けない**。k は生値に対して定義されているため、補正した値で
 * 比を取ると k ごとずれる（FINDINGS.md）。
 *
 * 設定は走行画面と localStorage を共有する（同一オリジン）。 */
const STOCK_FRONT = 14, STOCK_REAR = 36;
const sprkFront = () => parseInt($('sf').value, 10) || STOCK_FRONT;
/* 表示係数 = 丁数比 × 校正トリム。丁数比は理論値（既定、トリム = 1）。
 * トリムは下の calibrateSpeed() が GPS から求めて localStorage に書き、
 * 走行画面と共有する。ギヤ判定には掛けない（`k` は生値に対して定義される）。 */
const TRIM_KEY = 'mc52_strim';
function speedTrim() {
  const v = parseFloat(localStorage.getItem(TRIM_KEY));
  return (v > 0.8 && v < 1.25) ? v : 1;
}
const speedCorr = () => sprkFront() / STOCK_FRONT * speedTrim();

/**
 * GPS 速度との一致からスプロケット丁数を推定する。
 *
 *   補正係数 c = Σ(GPS) / Σ(0D)   … 和の比で取る（各点の比を平均すると
 *                                    分母のノイズで上振れする）
 *   組み合わせ (前, 後) の係数 = (前 / 14) × (36 / 後)
 *
 * GPS は低速域で相対誤差が大きく比が発散するので 20km/h 以上だけを使う。
 *
 * **速度比だけでは (前, 後) は一意に決まらない。** 18/43 と 15/36 は係数が 0.4%
 * しか違わず区別できない。そこで現実的なレンジ内を総当たりし、適合度で並べた
 * うえで、同程度に合う候補の中では**純正からの変更が少ないもの**を優先する
 * （前後とも替える人は少ない、という事前分布）。候補は呼び出し側で提示して
 * 実車と照合できるようにする。
 */
/* 実際の品揃えに合わせた範囲（2026-08 調べ）。
 *   前 … サンスター 品番361 の設定歯数が 12-15T、キタコ 530-1818 は 13/14/15T。
 *         16T 以上は存在しない。15T でもスプロケットカバーへの干渉が報告される
 *         ほどで、物理的に大きくできない
 *   後 … サンスター RH-133 は 36T（純正歯数）のみ。NTB SPH-086R も 36T。
 *         主要メーカーが他の丁数を出していないため事実上固定。他車種流用に
 *         備えて前後 2 丁だけ余裕を持たせてある
 *
 * この範囲なら前は 7.1% 刻みになり、GPS の測定誤差 0.5% に対して一桁の余裕が
 * ある。候補が競合しないので、同点処理は保険としてしか働かない。 */
/* 前スプロケットの設定範囲（2026-08 調べ）。
 *   サンスター 品番361 の設定歯数が 12-15T、キタコ 530-1818 は 13/14/15T。
 *   16T 以上は存在しない。15T でもスプロケットカバーへの干渉が報告されるほどで、
 *   物理的に大きくできない。
 * 隣接する丁数の係数差は 7.1% で、GPS の測定誤差 0.5% に対し一桁の余裕がある。 */
const FRONT_RANGE = [12, 15];

/**
 * GPS 速度との一致から前スプロケット丁数を推定する。
 *
 *   補正係数 c = Σ(GPS) / Σ(0D)   … 和の比で取る（各点の比を平均すると
 *                                    分母のノイズで上振れする）
 *   丁数 f の係数 = f / 14
 *
 * GPS は低速域で相対誤差が大きく比が発散するので 20km/h 以上だけを使う。
 */
function estimateSprocket() {
  const sel = rows.filter(r => r.gspd != null && r.gspd > 20 && r.spd != null && r.spd > 0);
  if (sel.length < 30) return null;
  const c = sel.reduce((a, r) => a + r.gspd, 0) / sel.reduce((a, r) => a + r.spd, 0);
  const cand = [];
  for (let f = FRONT_RANGE[0]; f <= FRONT_RANGE[1]; f++) {
    cand.push({front: f, err: (f / STOCK_FRONT) / c - 1});
  }
  cand.sort((a, b) => Math.abs(a.err) - Math.abs(b.err));
  return {c, n: sel.length, cand};
}

const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

const $ = id => document.getElementById(id);
let rows = [], map = null, layer = null, marker = null, legend = null;
let cursor = -1;

// ── CSV 読み込み ─────────────────────────────────────────
// アプリ形式（rpm,speed_obd,…,lat,lon）と Mac 側 logger.py 形式
// （0C_rpm,0D_speed,…）の双方を受ける。後者に GPS は無いので地図は出ない。
const COLS = {
  t:['t_sec'], rpm:['rpm','0C_rpm'], spd:['speed_obd','0D_speed'], skew:['skew_ms'],
  thr:['throttle','11_tps'], ect:['ect','05_ect'], volt:['volt','42_volt'],
  lat:['lat'], lon:['lon'], gspd:['speed_gps'], acc:['gps_acc'],
};

function parseCsv(text) {
  const lines = text.split(/\r?\n/).filter(l => l.trim());
  if (!lines.length) throw new Error('空のファイル');
  const head = lines[0].split(',').map(s => s.trim());
  const pick = {};
  for (const key in COLS) {
    for (const c of COLS[key]) { const i = head.indexOf(c); if (i >= 0) { pick[key] = i; break; } }
  }
  if (pick.rpm === undefined || pick.spd === undefined) {
    throw new Error('rpm / 車速の列が見つからない: ' + head.join(','));
  }
  const num = (a, i) => (i === undefined || a[i] === undefined || a[i] === '') ? null : (isNaN(+a[i]) ? null : +a[i]);
  const out = [];
  for (let i = 1; i < lines.length; i++) {
    const a = lines[i].split(',');
    const r = {
      t: num(a, pick.t) ?? i, rpm: num(a, pick.rpm), spd: num(a, pick.spd),
      thr: num(a, pick.thr), ect: num(a, pick.ect), volt: num(a, pick.volt),
      lat: num(a, pick.lat), lon: num(a, pick.lon), gspd: num(a, pick.gspd),
      acc: num(a, pick.acc),
      skew: num(a, pick.skew),
    };
    out.push(r);
  }
  dropBadFixes(out);
  alignRpm(out);
  return out;
}

/* ── 精度の悪い測位を捨てる ────────────────────────────────
 * スマホの Geolocation はトンネル内でも測位を返し続けるが、精度半径が
 * 数百 m に膨らんだ嘘の座標になる。実測（2026-08-30 の走行、6,511 点）:
 *
 *   通常時          精度 4〜10m
 *   トンネル 7 箇所  精度 中央 200〜854m / 最大 1194m、各 10〜37 秒
 *   出口での飛び     245〜806m が 15 件
 *
 * 地図では「道路から数百 m 外れて彷徨い、出口で線が飛ぶ」形で出る。
 * 桁で分離できているので閾値で切れる。捨てた区間は線を繋がない
 * （繋ぐと走っていない直線が描かれるため）。
 *
 * `speed_gps` も同じ測位から出ているので一緒に捨てる。丁数推定が
 * Σ(GPS)/Σ(0D) を使っており、汚れた値が混ざると推定がずれる。 */
const GPS_ACC_MAX = 50;    // [m] これを超える測位は使わない
const GPS_BREAK_S = 5;     // [s] 測位がこれ以上空いたら線を切る
const GPS_DEV_KMH = 25;    // [km/h] OBD 車速との乖離がこれを超える測位も捨てる
const GPS_DEV_WIN = 5;     // [s] その判定に使う微分窓

const havM = (la1, lo1, la2, lo2) => {
  const R = 6371000, rad = Math.PI / 180;
  const s1 = Math.sin((la2 - la1) * rad / 2), s2 = Math.sin((lo2 - lo1) * rad / 2);
  return 2 * R * Math.asin(Math.sqrt(
    s1 * s1 + Math.cos(la1 * rad) * Math.cos(la2 * rad) * s2 * s2));
};

/* 精度が良いと申告しながら座標が凍る／ずれる測位を、OBD 車速との乖離で捨てる。
 * FL4 側も同じ判定を持つ（Pixel で「5 分半にわたり座標が完全に同一のまま点が
 * 出続けた」実測がある）。精度は測位の自己申告なので、これだけでは坑口の
 * 未収束を取りこぼす。
 *
 * **微分窓の選び方が要点。** 行間隔が 0.73 秒しかないため、精度 4m の位置差から
 * 速度を出すと 4m/0.73s ≒ 20km/h の雑音が乗る。FL4 の閾値 25km/h をそのまま
 * 1 行差分に当てると、トンネルの無い走行で 1,738 点が誤検出された。
 * 窓を広げると雑音は減るが、カーブで直線距離が実経路より短くなる誤差が増える。
 * 実測（3 走行 13,153 行）で 2s→誤検出 528 点、5s→0 点、10s→18 点。5 秒を採る。 */
function dropBadFixes(rows) {
  /* 2 つの判定は**どちらも元データ上で先に計算する**。精度基準で先に間引くと、
   * 消えた点の隣が窓を作れず（次の生存点まで時間が飛ぶ）評価されないまま残る。
   * 実測でその形にすると、拾えるはずの 42 点のうち 16 点しか捕まらなかった。 */
  const fix = [];
  for (let i = 0; i < rows.length; i++) if (rows[i].lat != null) fix.push(i);
  const bad = new Set();

  for (const i of fix) if (rows[i].acc != null && rows[i].acc > GPS_ACC_MAX) bad.add(i);

  // GPS の移動量が OBD 車速と釣り合わない測位。実測では該当点が 100%、
  // 精度不良の区間の前後 15 秒以内に出た＝坑口の縁（FL4 の trimAnchor 相当）。
  for (let a = 0; a < fix.length; a++) {
    let b = a;
    while (b + 1 < fix.length && rows[fix[b + 1]].t - rows[fix[a]].t < GPS_DEV_WIN) b++;
    const A = rows[fix[a]], B = rows[fix[b]], dt = B.t - A.t;
    if (dt < GPS_DEV_WIN * 0.6 || A.spd == null || B.spd == null) continue;
    const ref = (A.spd + B.spd) / 2 * speedCorr();
    const v = havM(A.lat, A.lon, B.lat, B.lon) / dt * 3.6;
    if (Math.abs(v - ref) > GPS_DEV_KMH) bad.add(fix[a]);
  }

  for (const i of bad) {
    rows[i].lat = rows[i].lon = rows[i].gspd = null;
    rows[i].badFix = true;
  }
  rows.badFixes = bad.size;
  return bad.size;
}

/* ── 回転数を車速の取得時刻へ合わせる ──────────────────────
 * rpm と車速は別リクエストなので取得時刻がずれる。加速中は比が過大に、
 * 減速中は過小になり、**符号が加減速で反転する**（実測: 加速 +7.3% /
 * 減速 -5.8%、FINDINGS.md）。エンブレ中の判定失敗の主因がこれ。
 *
 * 新旧でズレの符号が逆になる点に注意。
 *   旧（〜v20260828c）… 行は 0x0C の応答時に書かれ、車速は約 1 周期前。
 *                        **回転数のほうが新しい**。skew_ms 列は無い
 *   新（v20260828d〜） … 行は 0x0D の応答時。回転数は skew_ms だけ古い
 *
 * どちらも「回転数の時系列を、車速の取得時刻で線形補間して読み直す」で
 * 揃う。旧ログのズレは中央周期で近似する（実測でこの補正により判定失敗が
 * 43%→29% / 34%→20% に下がることを確認済み）。 */
function alignRpm(rows) {
  const dt = [];
  for (let i = 1; i < rows.length; i++) {
    const d = rows[i].t - rows[i-1].t;
    if (d > 0 && d < 5) dt.push(d);
  }
  dt.sort((a,b) => a-b);
  const cyc = dt.length ? dt[dt.length >> 1] : 0.5;
  const hasSkew = rows.some(r => r.skew != null);

  // 回転数サンプルの時刻と、揃えたい先（車速の取得時刻）
  const tr = rows.map(r => hasSkew ? r.t - (r.skew || 0) / 1000 : r.t);
  const ts = rows.map(r => hasSkew ? r.t : r.t - cyc);

  let j = 0;
  for (let i = 0; i < rows.length; i++) {
    const r = rows[i];
    r.rpmRaw = r.rpm;
    if (r.rpm == null) { r.rpmAl = null; continue; }
    const want = ts[i];
    while (j < rows.length - 1 && tr[j+1] <= want) j++;
    let k = j;
    while (k > 0 && tr[k] > want) k--;
    const a = rows[k], b = rows[Math.min(k+1, rows.length-1)];
    if (a.rpm == null || b.rpm == null || tr[k+1] == null || tr[k+1] <= tr[k]) {
      r.rpmAl = r.rpm;
    } else {
      const f = Math.max(0, Math.min(1, (want - tr[k]) / (tr[k+1] - tr[k])));
      r.rpmAl = a.rpm + (b.rpm - a.rpm) * f;
    }
  }
  rows.forEach(r => { r.aligned = cyc; r.hasSkew = hasSkew; });
}

// ── ギヤ判定 ──────────────────────────────────────────────
// 比 = k * R(n)。最も近いギヤへ割り当てる。
//
// 判定できない場合を**意味で 3 つに分ける**。混ぜると読み違える。
//   'stop' … 車速ゼロ。判定できないのではなく、判定する対象が無い
//   'slow' … 低速すぎて比が定義できない（分母が小さく暴れる）
//   'unk'  … 比は出たがどの窓にも入らない＝半クラ・シフト中・k のずれ
const STOP_KMH = 1;      // これ以下を停車とみなす
/** 時刻補正の切替を反映して比を計算し直す。k のフィットより先に呼ぶこと。 */
function computeRatios() {
  const useAl = $('align').checked;
  const c = speedCorr();
  for (const r of rows) {
    const rp = useAl && r.rpmAl != null ? r.rpmAl : r.rpmRaw;
    r.rpm = rp;
    /* `speed_obd` は四捨五入ではなく**切り捨て**なので、真値は +0.5 して扱う
     * （2026-08-30 同定。段ごとの k のばらつきが 0.83% → 0.13% に潰れる）。
     * 丁数補正は掛けない。掛けると k ごとずれる。 */
    const sp = spdTrue(r.spd);
    r.ratio = (rp > 500 && sp >= 8.5) ? rp / sp : null;
    // 表示・線の太さの区分は丁数補正後（真の車速）
    r.spdTrue = sp == null ? null : sp * c;
  }
}

function assignGears(k, tolPct) {
  const tol = tolPct / 100;
  computeRatios();
  for (const r of rows) {
    r.gear = null;
    r.gstate = r.spd == null ? 'slow'
             : r.spd <= STOP_KMH ? 'stop'
             : r.ratio == null ? 'slow' : 'unk';
    if (r.ratio == null) continue;
    /* **アイドル回転では、嵌合している段は存在しない。**
     * クラッチを切って惰性で減速すると回転数がアイドル（約1,400）に張り付き、
     * 車速との比が偶然どれかの段と一致してしまう。実測では 6速 22km/h が
     * 理論 1,470rpm なので比としては正しく合ってしまい、残差では弾けない。
     * 車速下限 8km/h を課しているので**本物の 1速でも最低 1,828rpm**になる。
     * アイドル上限（実測 約1,500）と 1速の下限の間に閾値を置けば、正当な
     * 判定を 1 つも失わずに切り離せる。実測 13,153 行で落ちるのは 72 点、
     * その **100% がスロットル全閉**（＝クラッチを切って惰性走行）だった。 */
    if (r.rpm < GEAR_RPM_MIN) continue;
    let best = null, bd = Infinity;
    for (const n of GEARS) {
      const d = Math.abs(r.ratio / (k * R[n]) - 1);
      if (d < bd) { bd = d; best = n; }
    }
    // `speed_obd` は 1km/h 刻みで、±0.5km/h の量子化誤差が比に 0.5/車速 で
    // 効く。低速ほど不利になるので、その不確かさを許容へ足す（ロガーと同じ式）。
    if (bd <= tol + 0.5 / Math.max(r.spd + 0.5, 1)) { r.gear = best; r.gstate = 'gear'; }
  }
}

/** 連続した停車区間を時刻範囲で返す。グラフの帯に使う。 */
function stopSpans(minSec) {
  const out = [];
  let s = null;
  for (const r of rows) {
    if (r.gstate === 'stop') { if (s === null) s = r.t; }
    else if (s !== null) { if (r.t - s >= minSec) out.push([s, r.t]); s = null; }
  }
  if (s !== null && rows[rows.length-1].t - s >= minSec) out.push([s, rows[rows.length-1].t]);
  return out;
}

/** 斜線ハッチのパターン。停車帯の塗りに使う（ベタ塗りだとデータを隠す） */
let hatchPat = null;
function hatch(g) {
  if (hatchPat) return hatchPat;
  const c = document.createElement('canvas');
  c.width = c.height = 6;
  const h = c.getContext('2d');
  h.strokeStyle = 'rgba(125,136,153,.55)';
  h.lineWidth = 1;
  h.beginPath(); h.moveTo(-1, 7); h.lineTo(7, -1); h.moveTo(2, 10); h.lineTo(10, 2); h.stroke();
  hatchPat = g.createPattern(c, 'repeat');
  return hatchPat;
}

/** 連続した停車点をひとまとめにし、位置と停車時間を返す。 */
function stopRuns(minSec) {
  const out = [];
  let cur = null;
  for (const r of rows) {
    if (r.gstate === 'stop' && r.lat != null) {
      if (!cur) cur = {t0: r.t, t1: r.t, lat: r.lat, lon: r.lon, n: 1};
      else { cur.t1 = r.t; cur.lat += r.lat; cur.lon += r.lon; cur.n++; }
    } else if (cur) {
      if (cur.t1 - cur.t0 >= minSec) out.push(cur);
      cur = null;
    }
  }
  if (cur && cur.t1 - cur.t0 >= minSec) out.push(cur);
  for (const s of out) { s.lat /= s.n; s.lon /= s.n; s.sec = s.t1 - s.t0; }
  return out;
}

/**
 * k の当てはめ。gearcal.py と同じ考え方で、対数空間で「等間隔でない櫛」を
 * 平行移動させ、残差を頭打ちにした robust な評価で最小点を探す。
 * 外れ値（半クラ・シフト中）を引きずらないための頭打ち。
 */
function fitK() {
  const xs = rows.filter(r => r.ratio != null).map(r => Math.log(r.ratio));
  if (xs.length < 30) return null;
  const logR = GEARS.map(n => Math.log(R[n]));
  const cut = Math.log(1.08);
  const lo = Math.log(0.75), hi = Math.log(1.25), N = 2000;
  let best = null, bestC = Infinity;
  for (let i = 0; i < N; i++) {
    const lk = lo + (hi - lo) * i / (N - 1);
    let c = 0;
    for (const x of xs) {
      let d = Infinity;
      for (const lr of logR) { const v = Math.abs(x - lk - lr); if (v < d) d = v; }
      c += Math.min(d, cut) ** 2;
    }
    if (c < bestC) { bestC = c; best = lk; }
  }
  return Math.exp(best);
}

// ── 地図 ─────────────────────────────────────────────────
const SPD_STEPS = [20, 40, 60, 80];        // 太さの区切り [km/h]
const SPD_W = [2, 3, 4.5, 6, 7.5];         // 対応する線幅 [px]
const spdClass = v => v == null ? 0 : SPD_STEPS.filter(s => v >= s).length;   // 補正後の車速で区分する

/* ══ 測位を捨てた区間を道路形状で埋める ═══════════════════════
 * 端点の座標と進行方位を OSRM に渡して経路を引き、OBD 車速の積分で距離を
 * 時間に配分する。**トンネルの同定は不要**で、端点と方位さえあれば経路は
 * 一意に決まる（FL4 の設計判断をそのまま採る。市街地の高架下など、測位が
 * 壊れる場面すべてに同じ処理が使える）。
 *
 * 進行方位で拘束するのが要点。拘束しないと分離帯のある道路で反対車線に
 * スナップし、次の IC まで行って折り返す経路が返る（FL4 実測 +182%）。
 *
 * 合否は「経路長と車速積分の一致」で見る。両者は独立に得た量なので、
 * 一致すれば経路が正しいことの裏付けになる。落ちた区間は線を引かない。
 *
 * **座標が外部サービス（OSRM 公開サーバ）へ送られる。** 走行の位置情報を
 * 第三者に渡すことになるので、嫌なら OSRM_ON を false にする。 */
const OSRM_ON = true;
const OSRM_SERVER = 'https://router.project-osrm.org';
const FILL_MIN_M = 100;    // これ未満の空白は埋めない
const FILL_TOL_PCT = 8;    // 経路長と車速積分の許容乖離
const FILL_STEP_M = 25;    // 出力する点の間隔
const FILL_VVALID = [8, 140];   // 走行として成立する平均速度 [km/h]

let fills = [];            // {pts:[[lat,lon]...], km, errPct} 検証を通ったものだけ

const bearingDeg = (a, b) => {
  const y = (b.lon - a.lon) * Math.cos(a.lat * Math.PI / 180);
  return (Math.atan2(y, b.lat - a.lat) * 180 / Math.PI + 360) % 360;
};

async function routeBetween(a, b, brgA, brgB) {
  const u = `${OSRM_SERVER}/route/v1/driving/${a.lon},${a.lat};${b.lon},${b.lat}`
          + `?overview=full&geometries=geojson&bearings=${Math.round(brgA)},45;`
          + `${Math.round(brgB)},45&radiuses=50;50`;
  const j = await (await fetch(u)).json();
  if (j.code !== 'Ok' || !j.routes || !j.routes.length) return {ok:false, reason:'OSRM: ' + j.code};
  const pts = j.routes[0].geometry.coordinates.map(c => ({lat:c[1], lon:c[0]}));
  const cum = [0];
  for (let i = 1; i < pts.length; i++)
    cum.push(cum[i-1] + havM(pts[i-1].lat, pts[i-1].lon, pts[i].lat, pts[i].lon));
  return {ok:true, pts, cum, length:cum[cum.length-1]};
}

/** 時刻 t に最も近い行。補完点の色と太さを実測から引くのに使う。 */
function rowAtTime(t) {
  if (!rows.length) return null;
  let lo = 0, hi = rows.length - 1;
  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (rows[m].t <= t) lo = m; else hi = m; }
  return (Math.abs(rows[lo].t - t) <= Math.abs(rows[hi].t - t)) ? rows[lo] : rows[hi];
}

function alongRoute(rt, s) {
  const {pts, cum} = rt;
  if (s <= 0) return pts[0];
  if (s >= cum[cum.length-1]) return pts[pts.length-1];
  let lo = 0, hi = cum.length - 1;
  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (cum[m] <= s) lo = m; else hi = m; }
  const w = (s - cum[lo]) / (cum[hi] - cum[lo]);
  return {lat: pts[lo].lat + (pts[hi].lat - pts[lo].lat) * w,
          lon: pts[lo].lon + (pts[hi].lon - pts[lo].lon) * w};
}

/** 車速を台形則で積分。OBD 自身の欠測も内挿で埋める（飛ばすと距離が抜ける）。 */
function integrateDistance(t0, t1) {
  const s = rows.filter(r => r.t >= t0 && r.t <= t1 && r.spd != null);
  if (s.length < 2) return null;
  const out = [{t: s[0].t, d: 0}];
  let d = 0;
  for (let i = 1; i < s.length; i++) {
    const dt = s[i].t - s[i-1].t;
    if (dt <= 0 || dt > 30) continue;
    const v0 = spdTrue(s[i-1].spd) * speedCorr(), v1 = spdTrue(s[i].spd) * speedCorr();
    d += (v0 + v1) / 2 / 3.6 * dt;
    out.push({t: s[i].t, d});
  }
  return {series: out, total: d};
}

/** 測位を捨てた区間の一覧。両端は生き残った測位。 */
function findFillGaps() {
  const fix = [];
  for (let i = 0; i < rows.length; i++) if (rows[i].lat != null) fix.push(i);
  const out = [];
  for (let k = 1; k < fix.length; k++) {
    const a = fix[k-1], b = fix[k];
    if (rows[b].t - rows[a].t < GPS_BREAK_S) continue;
    out.push({a, b, ka: k-1, kb: k, fix});
  }
  return out;
}

async function fillGaps() {
  fills = [];
  if (!OSRM_ON) return;
  const gaps = findFillGaps();
  if (!gaps.length) return;
  const notes = [];
  for (const g of gaps) {
    const A = rows[g.a], B = rows[g.b], T = B.t - A.t;
    // 方位は少し離れた点から取る。直前直後だと雑音で向きが定まらない
    const pa = rows[g.fix[Math.max(0, g.ka - 5)]], pb = rows[g.fix[Math.min(g.fix.length-1, g.kb + 5)]];
    try {
      const L0 = havM(A.lat, A.lon, B.lat, B.lon);
      const d = integrateDistance(A.t, B.t);
      if (!d) { notes.push('車速の積分が取れない'); continue; }
      // 100m も動いていない途絶は埋める意味が無い。理由として数えもしない
      if (d.total < FILL_MIN_M) continue;

      const rt = await routeBetween(A, B, bearingDeg(pa, A), bearingDeg(B, pb));
      let use = null, errPct = 0, straight = false;
      if (rt.ok && rt.length >= FILL_MIN_M) {
        const e = (d.total - rt.length) / rt.length * 100;
        const v = rt.length / T * 3.6;
        if (Math.abs(e) <= FILL_TOL_PCT && v >= FILL_VVALID[0] && v <= FILL_VVALID[1]) {
          use = rt; errPct = e;
        }
      }
      /* 経路が使えないとき、**車速積分が直線距離と一致するなら直線で引く**。
       * トンネルは掘り抜きなので実際にほぼ直線で、実測 7 区間中 6 区間で
       * 走行距離が直線距離の 0.95〜1.01 倍だった。OSRM が価値を持つのは
       * 経路が実際に曲がっている区間だけ（実測 1 区間、D/L0=1.15）。
       *
       * 直線を引くこと自体は推測だが、**独立に得た 2 つの距離が一致する**
       * ことが裏付けになる。距離が分からないまま端点を繋ぐのとは別物。
       * 実測では龍王峡付近で OSRM が 2.3 倍の迂回路を返し（対岸の旧道か
       * 通行不可扱い）、直線 750m / 積分 735m が一致した。 */
      if (!use) {
        const e0 = (d.total - L0) / L0 * 100;
        const v0 = L0 / T * 3.6;
        if (L0 >= FILL_MIN_M && Math.abs(e0) <= FILL_TOL_PCT
            && v0 >= FILL_VVALID[0] && v0 <= FILL_VVALID[1]) {
          const cum = [0, L0];
          use = {pts: [{lat:A.lat, lon:A.lon}, {lat:B.lat, lon:B.lon}], cum, length: L0};
          errPct = e0; straight = true;
        }
      }
      if (!use) {
        notes.push(rt.ok
          ? `経路 ${(rt.length/1000).toFixed(2)}km・直線 ${(L0/1000).toFixed(2)}km のどちらも車速積分 ${(d.total/1000).toFixed(2)}km と合わない`
          : `${rt.reason}、直線も車速積分と合わない`);
        continue;
      }
      const rtU = use;
      /* 累積距離を経路長へ正規化して並べる。**時刻も持たせる。**
       * トンネル内でも OBD は生きているのでギヤと車速は実測値があり、
       * 推定なのは位置だけ。色と太さは実測と同じ意味で描ける。 */
      const k = rtU.length / d.total, pts = [];
      let last = -1e9;
      for (const q of d.series) {
        const s = q.d * k;
        if (s - last < FILL_STEP_M) continue;
        const p = alongRoute(rtU, s);
        pts.push({lat:p.lat, lon:p.lon, t:q.t}); last = s;
      }
      pts.unshift({lat:A.lat, lon:A.lon, t:A.t});
      pts.push({lat:B.lat, lon:B.lon, t:B.t});
      fills.push({pts, km: rtU.length/1000, errPct, straight});
    } catch (e) { notes.push('経路探索に失敗: ' + e.message); }
    await new Promise(r => setTimeout(r, 300));   // 公開サーバなので間隔を空ける
  }
  fills.notes = notes;
}

function drawMap() {
  const pts = rows.filter(r => r.lat != null && r.lon != null);
  // Leaflet は CDN 依存。読めなくてもチャート側は成立させたいので、
  // ここで打ち切って以降の処理を巻き込まない。
  if (typeof L === 'undefined') {
    $('empty').textContent = '地図を読み込めない（通信不可）。チャートのみ表示する';
    $('empty').classList.remove('hide');
    return;
  }
  $('empty').classList.toggle('hide', pts.length > 0);
  if (!pts.length) {
    $('empty').textContent = 'このログに GPS 座標が無い。チャートのみ表示する';
    if (layer) layer.clearLayers();
    return;
  }

  if (!map) {
    map = L.map('mapc', {preferCanvas:true, zoomControl:true});
    addFitControl();
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom:19, attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
    }).addTo(map);
    layer = L.layerGroup().addTo(map);
    marker = L.circleMarker([0,0], {radius:6, color:'#fff', weight:2,
      fillColor:css('--accent'), fillOpacity:1, interactive:false});
    addLegend();
  }
  layer.clearLayers();

  // 同じ (ギヤ, 速度クラス) が続く区間をまとめて 1 本の polyline にする。
  // 1 点ごとに線を引くと数千本になって特に端末側で重い。
  const runs = [];
  let cur = null, prevT = null;
  for (const p of pts) {
    // 測位が飛んでいる＝間に捨てた区間がある。ここで線を切る。繋ぐと
    // 走っていない直線がトンネルを串刺しにして描かれる
    const brk = prevT != null && p.t - prevT > GPS_BREAK_S;
    const key = (p.gear ?? p.gstate) + ':' + spdClass(p.spdTrue);
    if (!cur || cur.key !== key || brk) {
      if (cur && !brk) { cur.pts.push([p.lat, p.lon]); }   // 境界点を共有して線を繋ぐ
      cur = {key, gear:p.gear, st:p.gstate, w:SPD_W[spdClass(p.spdTrue)], pts:[[p.lat, p.lon]]};
      runs.push(cur);
    } else {
      cur.pts.push([p.lat, p.lon]);
    }
    prevT = p.t;
  }
  const casing = css('--casing');
  for (const run of runs) {
    if (run.pts.length < 2) continue;
    // 1 ギヤだけ抜き出しているときは、他を薄く落として背景として残す
    const dim = isolate !== null && run.gear !== isolate;
    // 停車区間は線を引かない（動いていないので線に意味が無い）。マーカーで示す
    if (run.st === 'stop') continue;
    // ギヤは実線。判定不能な区間は**細い破線**にして、色だけに頼らず区別できる
    // ようにする。実測と同じ太さだと同じ重みに見えてしまう
    const dash = run.gear ? null : (run.st === 'slow' ? '1,4' : '3,4');
    const w = run.gear ? run.w : Math.max(1.5, run.w * 0.5);
    // ケーシングを先に敷く。下地(OSMタイル)とのコントラストはこれで担保する。
    // 破線の区間はケーシングも同じ破線にしないと、隙間が暗く埋まって
    // 「濃い実線」に見えてしまい破線として読めない
    L.polyline(run.pts, {color:casing, weight:w + (run.gear ? 3 : 2), opacity: dim ? .12 : .9,
      dashArray: dash, lineCap: dash ? 'butt' : 'round',
      lineJoin:'round', interactive:false}).addTo(layer);
    L.polyline(run.pts, {color: run.gear ? css(GCOL[run.gear]) : css('--gx'),
      weight:w, opacity: dim ? .18 : 1, dashArray: dash,
      lineCap: dash ? 'butt' : 'round', lineJoin:'round', interactive:false}).addTo(layer);
  }

  /* 測位を捨てた区間の補完。**色と太さは実測と同じ意味**で描く（トンネル内でも
   * OBD は生きており、ギヤも車速も実測値がある。推定なのは位置だけ）。
   * 区別は **破線＋ケーシング無し＋不透明度を落とす** の 3 点で付ける。
   * ケーシングを敷かないことが、実測との差が一番はっきり出る手掛かりになる。 */
  for (const f of fills) {
    if (f.pts.length < 2) continue;
    let c2 = null; const fr = [];
    for (const p of f.pts) {
      const r = rowAtTime(p.t);
      const g = r ? r.gear : null, sc = spdClass(r ? r.spdTrue : null);
      const key = (g ?? 'x') + ':' + sc;
      if (!c2 || c2.key !== key) {
        if (c2) c2.pts.push([p.lat, p.lon]);          // 境界点を共有
        c2 = {key, gear:g, w:SPD_W[sc], pts:[[p.lat, p.lon]]};
        fr.push(c2);
      } else c2.pts.push([p.lat, p.lon]);
    }
    for (const r of fr) {
      if (r.pts.length < 2) continue;
      const dim = isolate !== null && r.gear !== isolate;
      L.polyline(r.pts, {color: r.gear ? css(GCOL[r.gear]) : css('--gx'),
        weight: r.gear ? r.w : Math.max(1.5, r.w * 0.5), opacity: dim ? .12 : .72,
        dashArray:'5,4', lineCap:'butt', lineJoin:'round', interactive:false}).addTo(layer);
    }
  }
  marker.addTo(layer);
  marker.bringToFront();   // 補完線を後から足しても隠れないようにする
  /* 全景の範囲は毎回控えておく。抜き出しを切り替えても「全景」で戻れるように
     するためで、視点そのものは最初の描画時だけ合わせる（切り替えのたびに
     戻されると、拡大して見ている最中に飛ばされる）。 */
  trackBounds = L.latLngBounds(pts.map(p => [p.lat, p.lon]));
  if (!drawMap._fitted) {
    fitAll();
    drawMap._fitted = true;
  }
}

let trackBounds = null;

/** 経路全体が入るところまで引く。「全景」ボタンと初回描画で共用する。
 *  ナビ中は自車固定・回転中なので、全景を押したらナビを抜ける。 */
function fitAll() {
  if (navOn) { setNav(false); return; }
  if (trackBounds && trackBounds.isValid()) map.fitBounds(trackBounds, {padding:[24,24]});
}

/** 地図上に「全景」ボタンを置く。ヘッダではなく地図の操作なので地図の上に置く。 */
function addFitControl() {
  const c = L.control({position:'topleft'});
  c.onAdd = () => {
    const d = L.DomUtil.create('div', 'leaflet-bar leaflet-control fitctl');
    d.innerHTML = '<a href="#" role="button" title="経路全体が入るまで引く">全景</a>';
    L.DomEvent.disableClickPropagation(d);
    L.DomEvent.on(d, 'click', e => { L.DomEvent.preventDefault(e); fitAll(); });
    return d;
  };
  c.addTo(map);
}

function addLegend() {
  legend = L.control({position:'bottomright'});
  legend.onAdd = () => {
    const d = L.DomUtil.create('div', 'leaflet-control legend');
    let sw = '';
    // 色だけに頼らないよう、各段に数字と破線パターンを添える。タップで抜き出し
    for (const n of GEARS) {
      sw += `<span class="gsel${isolate === n ? ' on' : ''}" data-g="${n}">`
          + `<span class="sw" style="background:${css(GCOL[n])}"></span>${n}</span>`;
    }
    let wd = '';
    const lbl = ['〜20','〜40','〜60','〜80','80〜'];
    for (let i = 0; i < SPD_W.length; i++)
      wd += `<i style="width:1.1rem;height:${SPD_W[i]}px"></i><span>${lbl[i]}</span>`;
    d.innerHTML = `<b>ギヤ（線の色）</b><div class="row">${sw}
      </div>
      <div class="row" style="margin-top:.25rem">
      <svg width="26" height="8"><line x1="0" y1="4" x2="26" y2="4" stroke="${css('--gx')}" stroke-width="2.5" stroke-dasharray="3,4"/></svg><span>半クラ・シフト</span>
      <svg width="26" height="8"><line x1="0" y1="4" x2="26" y2="4" stroke="${css('--gx')}" stroke-width="2.5" stroke-dasharray="1,4"/></svg><span>低速</span></div>
      <div class="row"><svg width="26" height="8"><line x1="0" y1="4" x2="26" y2="4" stroke="${css('--g3')}" stroke-width="2.5" stroke-dasharray="5,4" opacity=".72"/></svg><span>位置は推定（縁なし・破線）</span></div>
      <b style="margin-top:.4rem">車速 km/h（線の太さ）</b><div class="wd">${wd}</div>`;
    L.DomEvent.disableClickPropagation(d);
    d.querySelectorAll('.gsel').forEach(el => {
      el.onclick = () => {
        const g = +el.dataset.g;
        isolate = (isolate === g) ? null : g;   // 同じものを再度押すと全表示へ戻る
        legend.remove(); addLegend();
        drawMap();
      };
    });
    return d;
  };
  legend.addTo(map);
}

// ── チャート ─────────────────────────────────────────────
// 依存ゼロの自前描画。6 枚の小倍数（small multiples）で X 軸を共有する。
// 各パネルは単一系列なので凡例は置かない（見出しが系列名を兼ねる）。
const SERIES = [
  {key:'spdTrue', name:'車速', unit:'km/h', fix:0},   // 補正後（真の車速）
  // 目盛りが 1/6 に丸まる範囲にする（0 や 7 は実在しない段なので出さない）
  {key:'gear', name:'ギヤ',   unit:'',     fix:0, step:true, min:0.6, max:6.4},
  {key:'rpm',  name:'回転数', unit:'rpm',  fix:0},
  {key:'thr',  name:'スロットル', unit:'%', fix:1},
  {key:'ect',  name:'水温',   unit:'℃',   fix:0},
  {key:'volt', name:'電圧',   unit:'V',    fix:2},
];

function buildCharts() {
  const side = $('side');
  side.innerHTML = '';
  for (const s of SERIES) {
    const d = document.createElement('div');
    d.className = 'chart';
    d.innerHTML = `<h3>${s.name}<span id="v_${s.key}">--</span></h3><canvas id="c_${s.key}"></canvas>`;
    side.appendChild(d);
    s.canvas = d.querySelector('canvas');
    bindCursor(s.canvas);
  }
  drawCharts();
}

function drawCharts() {
  for (const s of SERIES) drawChart(s);
}

/* 系列も目盛りも停車帯も、再生中は一切変わらない。毎フレーム全行をなぞると
 * 6 枚 × 13,000 点で端末が持たないので、**カーソル以外をオフスクリーンへ
 * 1 回だけ描いて使い回す**。データ・k・判定窓・丁数が変われば chartEpoch を
 * 進めて捨てる。再生のためだけでなく、スクラブ操作も同じだけ軽くなる。 */
let chartEpoch = 0;

function buildChartBg(s, w, h, dpr) {
  s.bg = null; s.X = null;
  if (!rows.length) return;

  const vals = rows.map(r => r[s.key]);
  const ok = vals.filter(v => v != null);
  if (!ok.length) return;
  let lo = s.min !== undefined ? s.min : Math.min(...ok);
  let hi = s.max !== undefined ? s.max : Math.max(...ok);
  if (hi === lo) { hi = lo + 1; }
  // 範囲を明示した系列（ギヤ）は余白を足さない。目盛りが実在しない値になるため
  const fixed = s.min !== undefined && s.max !== undefined;
  const pad = fixed ? 0 : (hi - lo) * 0.08;
  lo -= pad; hi += pad;
  const t0 = rows[0].t, t1 = rows[rows.length - 1].t || 1;
  const X = t => 30 + (w - 36) * ((t - t0) / (t1 - t0 || 1));
  const Y = v => h - 12 - (h - 20) * ((v - lo) / (hi - lo));

  const cv = document.createElement('canvas');
  cv.width = w * dpr; cv.height = h * dpr;
  const g = cv.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);

  // 停車区間の帯。停車は「判定できない」のではなく「判定する対象が無い」ので、
  // 判定不能とは別に示す。ベタ塗りだと下のデータを隠すのでハッチにする
  g.fillStyle = hatch(g);
  for (const [a, b] of stopSpans(3)) {
    const x0 = X(a), x1 = X(b);
    if (x1 > x0) g.fillRect(x0, 2, Math.max(1.5, x1 - x0), h - 8);
  }

  /* 時間軸の目盛り。**6 枚が X 軸を共有しているので全チャートに引く。**
   * 下端の 1 枚だけに置くとスクロールで見えなくなり、区間を時刻で指す用が
   * 足せない（ログの何分何秒を見ているかが分からない）。 */
  {
    const span = t1 - t0;
    const STEPS = [10, 30, 60, 120, 300, 600, 900, 1800];
    const step = STEPS.find(v => span / v <= 9) || 3600;
    g.strokeStyle = css('--line'); g.lineWidth = 1;
    g.fillStyle = css('--mute'); g.font = '9px -apple-system,sans-serif';
    g.textAlign = 'center';
    // 刻みは**経過時間**で置く。絶対時刻で刻むと開始が端数のぶんずれて
    // 「9:59」のような目盛りになり、区間を時刻で指すときに読みにくい
    for (let e = step; e <= span; e += step) {
      const x = X(t0 + e);
      g.globalAlpha = .5;
      g.beginPath(); g.moveTo(x, 2); g.lineTo(x, h - 11); g.stroke();
      g.globalAlpha = 1;
      g.fillText(mmss(e), x, h - 2);
    }
  }

  // 目盛りは控えめに。上下の 2 本だけ
  g.strokeStyle = css('--line'); g.lineWidth = 1;
  g.beginPath(); g.moveTo(30, Y(hi - pad)); g.lineTo(w - 6, Y(hi - pad));
  g.moveTo(30, Y(lo + pad)); g.lineTo(w - 6, Y(lo + pad)); g.stroke();
  g.fillStyle = css('--mute'); g.font = '9px -apple-system,sans-serif'; g.textAlign = 'right';
  g.fillText((hi - pad).toFixed(s.fix), 27, Y(hi - pad) + 3);
  g.fillText((lo + pad).toFixed(s.fix), 27, Y(lo + pad) + 3);

  // 2px の細い線。系列は 1 本なので色は共通のアクセント。
  //
  // **欠測の区間は切らずに破線で繋ぐ。** 特にギヤは半クラ・シフトのたびに
  // 判定不能になるため、切ると線が細切れになって前後の段が読めない。
  // 破線＝その区間はデータが無い、実線＝実測、と読み分けられるようにする。
  const solid = new Path2D(), dashed = new Path2D();
  let prev = null, gapped = false, hadStop = false;
  for (const r of rows) {
    const v = r[s.key];
    if (v == null) {
      gapped = true;
      // 停車を挟んだ欠測は繋がない。動いていない区間をまたいで線を引くと、
      // 存在しない連続性を示してしまう（帯で停車と分かるので繋ぐ必要も無い）
      if (r.gstate === 'stop') hadStop = true;
      continue;
    }
    const x = X(r.t), y = Y(v);
    if (prev && !hadStop) {
      const path = gapped ? dashed : solid;
      path.moveTo(prev.x, prev.y);
      if (s.step) { path.lineTo(x, prev.y); path.lineTo(x, y); }   // ギヤは階段
      else { path.lineTo(x, y); }
    }
    prev = {x, y}; gapped = false; hadStop = false;
  }
  g.strokeStyle = css('--accent');
  g.lineJoin = 'round'; g.lineCap = 'round';
  g.lineWidth = 2; g.setLineDash([]); g.stroke(solid);
  // 繋ぎは実測より細くする。実線と同じ太さだと同じ重みに見えてしまう
  g.lineWidth = 1; g.setLineDash([2, 3]); g.stroke(dashed);
  g.setLineDash([]);

  s.bg = cv; s.X = X; s.Y = Y;
}

function drawChart(s) {
  // キャンバスが未生成のうちに refresh() が走ることがある（丁数の自動推定が
  // buildCharts より前に refresh を呼ぶ経路があった）。例外にすると読み込み
  // 処理ごと中断してチャートが 1 枚も出なくなるので、ここで黙って戻る
  if (!s.canvas) return;
  const cv = s.canvas, dpr = devicePixelRatio || 1;
  const w = cv.clientWidth, h = cv.clientHeight;
  if (!w || !h) return;
  const key = w + '|' + h + '|' + dpr + '|' + chartEpoch;
  if (s.bgKey !== key) { buildChartBg(s, w, h, dpr); s.bgKey = key; }
  if (cv.width !== w * dpr || cv.height !== h * dpr) { cv.width = w * dpr; cv.height = h * dpr; }
  const g = cv.getContext('2d');
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.clearRect(0, 0, cv.width, cv.height);
  if (!s.bg) return;
  g.drawImage(s.bg, 0, 0);
  g.setTransform(dpr, 0, 0, dpr, 0, 0);

  // 毎フレーム描き直すのはカーソルだけ
  if (cursor >= 0 && cursor < rows.length && s.X) {
    const x = s.X(rows[cursor].t);
    g.strokeStyle = css('--warn'); g.lineWidth = 1;
    g.beginPath(); g.moveTo(x, 4); g.lineTo(x, h - 6); g.stroke();
    const v = rows[cursor][s.key];
    if (v != null) {
      g.fillStyle = css('--warn');
      g.beginPath(); g.arc(x, s.Y(v), 3, 0, 7); g.fill();
    }
  }
}

// ── 連動カーソル ─────────────────────────────────────────
// チャートをなぞると、その時刻の値が見出しに出て地図上の位置も動く。
function bindCursor(cv) {
  /* タッチでは「横に動かす意図」が確認できるまでスクラブを始めない。
   * 縦に動かしているならブラウザにスクロールさせる（touch-action:pan-y）。
   *
   * **押したときだけ位置を確定する。** マウスのホバーは下見に留め、離れたら
   * 確定位置へ戻す。再生が付いたことでカーソルは「再生位置」の意味を持ったので、
   * 再生ボタンへマウスを動かす途中で位置が引きずられると選び直せない。 */
  let start = null, locked = false, down = false;
  const LOCK_PX = 8;

  const scrub = (e, commit) => {
    if (!rows.length) return;
    const rect = cv.getBoundingClientRect();
    const cx = e.clientX - rect.left;
    const t0 = rows[0].t, t1 = rows[rows.length - 1].t || 1;
    const t = t0 + (t1 - t0) * Math.max(0, Math.min(1, (cx - 30) / (rect.width - 36)));
    let bi = 0, bd = Infinity;
    for (let i = 0; i < rows.length; i++) {
      const d = Math.abs(rows[i].t - t);
      if (d < bd) { bd = d; bi = i; }
    }
    viewT = t;          // なぞった位置そのもの。行にスナップさせない
    setCursor(bi);
    /* **再生位置は確定操作のときだけ更新する。** setCursor の中で更新すると、
     * 再生ループが進めた playT を行の時刻へスナップして戻してしまう。行間隔が
     * 0.73 秒あるので、1 倍速では 1 フレーム 0.017 秒しか進まず必ず同じ行に戻り、
     * **再生が止まったまま**になる（v20260831i の不具合）。 */
    if (commit) playT = rows[bi].t;
  };

  // ホバーの下見から確定位置へ戻す
  const restore = () => {
    if (!rows.length) { setCursor(-1); return; }
    setCursor(idxAtT(playT));
  };

  cv.addEventListener('pointerdown', e => {
    if (e.pointerType === 'touch') { start = {x: e.clientX, y: e.clientY}; locked = false; }
    else { locked = true; down = true; scrub(e, true); }   // クリックで確定
  });

  cv.addEventListener('pointermove', e => {
    if (e.pointerType !== 'touch') { scrub(e, down); return; }   // 押していなければ下見
    if (!start) return;
    if (!locked) {
      const dx = Math.abs(e.clientX - start.x), dy = Math.abs(e.clientY - start.y);
      if (dy > dx && dy > LOCK_PX) { start = null; return; }   // 縦。スクロールに任せる
      if (dx < LOCK_PX) return;                                 // まだ判断できない
      locked = true;
    }
    scrub(e, true);       // タッチで横へ動かすのは意図的な操作なので確定
    e.preventDefault();   // 横と確定した後だけ抑止する
  });

  const end = () => { start = null; locked = false; down = false; };
  cv.addEventListener('pointerup', end);
  cv.addEventListener('pointercancel', end);          // ブラウザがスクロールを引き取った
  cv.addEventListener('pointerleave', e => {
    end();
    // マウスは離れたら確定位置へ戻す。タッチは指を離した位置がそのまま確定
    if (e.pointerType !== 'touch') restore();
  });
}

/* ══ 再生 ═══════════════════════════════════════════════════
 * カーソルを時間で進めるだけ。地図・数値・チャートの同期は setCursor が
 * 既に持っているので、ここは「時刻を進めて一番近い行を選ぶ」しかしない。
 * チャートは背景をキャッシュしてあるので、毎フレームの描画はカーソル線だけ。 */
const SPEEDS = [1, 2, 5, 10, 30];
let playing = false, playSpeed = 1, playT = 0, lastRAF = 0;

const tSpan = () => rows.length ? [rows[0].t, rows[rows.length - 1].t] : [0, 0];

/** 時刻 t に最も近い行の番号。 */
function idxAtT(t) {
  if (!rows.length) return -1;
  let lo = 0, hi = rows.length - 1;
  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (rows[m].t <= t) lo = m; else hi = m; }
  return (Math.abs(rows[lo].t - t) <= Math.abs(rows[hi].t - t)) ? lo : hi;
}

function setPlay(p) {
  const [, t1] = tSpan();
  playing = p && rows.length > 0;
  if (playing && playT >= t1) playT = tSpan()[0];   // 終端で押したら頭から
  lastRAF = 0;
  $('pPlay').textContent = playing ? '❚❚' : '▶';
}

function seekTo(t) {
  const [t0, t1] = tSpan();
  playT = Math.max(t0, Math.min(t1, t));
  viewT = playT;
  setCursor(idxAtT(playT));
}

function playTick(ts) {
  if (playing && rows.length) {
    const [, t1] = tSpan();
    if (lastRAF) playT += (ts - lastRAF) / 1000 * playSpeed;
    lastRAF = ts;
    if (playT >= t1) { playT = t1; setPlay(false); }
    viewT = playT;
    setCursor(idxAtT(playT));
  }
  requestAnimationFrame(playTick);
}
requestAnimationFrame(playTick);

$('pPlay').onclick = () => setPlay(!playing);
$('pBack').onclick = () => seekTo(playT - 5);
$('pFwd').onclick  = () => seekTo(playT + 10);
$('pSpd').innerHTML = SPEEDS.map(s =>
  `<button data-s="${s}"${s === 1 ? ' class="on"' : ''}>${s}×</button>`).join('');
$('pSpd').querySelectorAll('button').forEach(b => b.onclick = () => {
  playSpeed = +b.dataset.s;
  $('pSpd').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
});

/** 経過秒を m:ss にする。区間を探すときに秒で言えないと照合できない。 */
function mmss(sec) {
  const s = Math.max(0, Math.round(sec));
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}

/* 現在位置。測位を捨てた区間では行に座標が無いので、補完した経路の上を走らせる。
 * ここを埋めないと**トンネルに入った瞬間にマーカーが消える**ため、再生が途切れて見える。 */
function markerPos(r) {
  if (r.lat != null) return {ll: [r.lat, r.lon], est: false};
  for (const f of fills) {
    const a = f.pts[0].t, b = f.pts[f.pts.length - 1].t;
    if (r.t < a || r.t > b) continue;
    let best = f.pts[0], bd = Infinity;
    for (const p of f.pts) { const d = Math.abs(p.t - r.t); if (d < bd) { bd = d; best = p; } }
    return {ll: [best.lat, best.lon], est: true};
  }
  return null;
}

/* ── ナビモード ────────────────────────────────────────
 *
 * 進行方向を上にし、自車を画面中心に固定する。地図のほうが動く。
 *
 * Leaflet に回転機能は無いので、**Leaflet コンテナ（#mapc）に CSS の
 * rotate を掛ける**。Leaflet 自身は内側の `.leaflet-map-pane` に transform を
 * 書くので、外側のコンテナを回しても衝突しない。
 *
 * 回すと矩形の角が地図の外へ出るため、#mapc を四方へ 21% 広げて（対角 √2 ぶん）
 * #map の overflow:hidden で切る。この広げた分だけ Leaflet のコントロールも
 * 画面外へ出るので、ナビ中は隠して自前のボタンに置き換える。
 */
let navOn = false, navHead = 0, navLastDraw = 0;
const NAV_ZOOM_DEFAULT = 17;
const NAV_FPS = 12;         // ゲージの描き直しだけ間引く。地図の追従は間引かない

function bearing(a, b) {
  const r = Math.PI / 180;
  const y = Math.sin((b[1] - a[1]) * r) * Math.cos(b[0] * r);
  const x = Math.cos(a[0] * r) * Math.sin(b[0] * r)
          - Math.sin(a[0] * r) * Math.cos(b[0] * r) * Math.cos((b[1] - a[1]) * r);
  return (Math.atan2(y, x) / r + 360) % 360;
}

/** 現在位置から少し先（または手前）を見て進行方位を出す。
 *  移動量が足りない・低速のときは前回の方位を保つ。 */
/**
 * 行ごとの進行方位を先に求めて `r.head` に入れる。読み込みのたびに 1 回だけ。
 *
 * **描画時に 2 点方位を取ると方位が離散的に変わる。** 起点が「最も近い行」で
 * 決まるためサンプル間隔の中点で飛び、終点も別の行へ切り替わるので、生の方位が
 * 階段状になる。毎フレームの指数平滑では階段を追うだけで、細かい揺れが残る。
 *
 * そこで行ごとに**前後 HEAD_M ずつの点を結んだ方位**を求めておく。基線が実質
 * 2·HEAD_M になるので GPS の位置誤差の寄与も小さくなる（8m 基線だと ±3m の
 * 誤差が ±20° に化けるが、30m なら ±6° 程度）。
 *
 * 値は**折り返さない連続値**として積む。そうすると描画時は素直に内挿できる。
 */
const HEAD_M = 15;          // 前後それぞれこの距離ぶんを見る
const HEAD_MAX_ROWS = 60;   // 探索の上限。停車中に延々と遡らない
const HEAD_SMOOTH = 2;      // 仕上げの移動平均の半幅（行）

function computeHeadings() {
  const pos = rows.map(r => markerPos(r));
  const raw = new Array(rows.length).fill(null);
  for (let i = 0; i < rows.length; i++) {
    const c = pos[i];
    if (!c) continue;
    let a = null, b = null;
    for (let j = i - 1, k = 0; j >= 0 && k < HEAD_MAX_ROWS; j--, k++) {
      if (!pos[j]) continue;
      a = pos[j];
      if (map.distance(pos[j].ll, c.ll) >= HEAD_M) break;
    }
    for (let j = i + 1, k = 0; j < rows.length && k < HEAD_MAX_ROWS; j++, k++) {
      if (!pos[j]) continue;
      b = pos[j];
      if (map.distance(c.ll, pos[j].ll) >= HEAD_M) break;
    }
    const p0 = a || c, p1 = b || c;
    if (p0 === p1 || map.distance(p0.ll, p1.ll) < 1) continue;   // 停車。前の値を引き継ぐ
    raw[i] = bearing(p0.ll, p1.ll);
  }
  // 折り返さない連続値にする
  const un = new Array(rows.length).fill(null);
  let prev = null;
  for (let i = 0; i < rows.length; i++) {
    if (raw[i] == null) { un[i] = prev; continue; }
    un[i] = prev == null ? raw[i]
          : prev + (((raw[i] - prev) % 360 + 540) % 360 - 180);
    prev = un[i];
  }
  for (let i = rows.length - 1; i >= 0 && un[i] == null; i--) un[i] = prev;
  for (let i = 0; i < rows.length && un[i] == null; i++) un[i] = un.find(v => v != null) ?? 0;
  // 残ったギザギザを移動平均で均す
  for (let i = 0; i < rows.length; i++) {
    let s = 0, n = 0;
    for (let j = i - HEAD_SMOOTH; j <= i + HEAD_SMOOTH; j++) {
      if (j < 0 || j >= rows.length || un[j] == null) continue;
      s += un[j]; n++;
    }
    rows[i].head = n ? s / n : (un[i] ?? 0);
  }
}

/** 時刻 `t` の方位。連続値なので前後の行を素直に内挿できる。 */
function headAtT(t) {
  const br = bracketAtT(t);
  if (!br) return navHead;
  const a = rows[br.lo].head, b = rows[br.hi].head;
  if (a == null) return b ?? navHead;
  if (b == null) return a;
  return a + (b - a) * br.k;
}

function navApply(i, force) {
  if (!navOn || i < 0 || !rows[i]) return;
  /* **地図の追従は間引かない。** 自車は画面中心に固定して描くので、地図だけを
   * 間引くと自車が進行方向へズレてから戻る動きになる（実際そうなっていた）。
   * 重いのは文字と円弧を描き直すゲージのほうなので、そちらだけ間引く。 */
  const mp = posAtT(viewT != null ? viewT : rows[i].t) || markerPos(rows[i]);
  if (mp) map.setView(mp.ll, map.getZoom(), {animate:false});
  navHead = headAtT(viewT != null ? viewT : rows[i].t);
  $('mapc').style.transform = `rotate(${-navHead}deg)`;
  const now = performance.now();
  if (force || now - navLastDraw >= 1000 / NAV_FPS) {
    navLastDraw = now;
    drawNavGauge(rows[i]);
  }
}

function setNav(on) {
  navOn = on;
  $('map').classList.toggle('nav', on);
  $('pNav').classList.toggle('on', on);
  if (on) {
    map.dragging.disable();                 // 自車固定なので動かす意味が無い
    if (legend) map.removeControl(legend);  // 回転の外に出せないうえ場所を食う
    map.setZoom(Math.max(map.getZoom(), NAV_ZOOM_DEFAULT));
  } else {
    map.dragging.enable();
    if (legend) legend.addTo(map);
    $('mapc').style.transform = '';
  }
  /* コンテナの寸法が変わった直後は、Leaflet が新しい大きさを拾い切れず
   * ベクタ層（経路と自車）が描かれないことがある。レイアウト確定後に
   * もう一度当てる。 */
  map.invalidateSize({animate:false});
  const settle = () => {
    map.invalidateSize({animate:false});
    if (cursor >= 0) navApply(cursor, true);
    else if (!navOn) fitAll();
  };
  settle();
  requestAnimationFrame(settle);
  setTimeout(settle, 220);   // #mapc の transition が終わったあと
}

/** 回転数・車速のゲージとギヤの段数を地図に重ねる。 */
function drawNavGauge(r) {
  const cv = $('navg'), dpr = devicePixelRatio || 1;
  const w = cv.clientWidth, h = cv.clientHeight;
  if (!w || !h) return;
  // **幅だけで判定すると高さの変化を取りこぼす**（ナビ切替や画面回転で起きる）
  if (cv.width !== w * dpr || cv.height !== h * dpr) { cv.width = w * dpr; cv.height = h * dpr; }
  const g = cv.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, w, h);
  // 画面が低いときはゲージも小さくする。下限を高く取ると地図を潰す
  const R = Math.min(58, Math.max(24, Math.min(w, h) * 0.16));
  const arc = (cx, cy, val, max, lab, unit) => {
    const a0 = Math.PI * 0.75, a1 = Math.PI * 2.25;
    // 地図は明暗どちらにもなるので、暗い円板を敷いてから描く
    g.fillStyle = 'rgba(16,20,26,.55)';
    g.beginPath(); g.arc(cx, cy, R + 6, 0, Math.PI * 2); g.fill();
    g.lineWidth = 7; g.lineCap = 'round';
    g.strokeStyle = 'rgba(255,255,255,.28)';
    g.beginPath(); g.arc(cx, cy, R, a0, a1); g.stroke();
    const v = Math.max(0, Math.min(1, (val || 0) / max));
    g.strokeStyle = css('--accent') || '#4a9eff';
    g.beginPath(); g.arc(cx, cy, R, a0, a0 + (a1 - a0) * v); g.stroke();
    g.fillStyle = '#fff'; g.textAlign = 'center';
    const s = val == null ? '--' : String(Math.round(val));
    // 4 桁の回転数は既定の字送りだと円からはみ出すので、桁数で縮める
    g.font = `600 ${R * (s.length >= 4 ? 0.40 : 0.52)}px ui-monospace,monospace`;
    g.fillText(s, cx, cy + R * 0.16);
    g.font = `${R * 0.24}px system-ui,sans-serif`; g.fillStyle = 'rgba(255,255,255,.7)';
    g.fillText(unit, cx, cy + R * 0.46);
  };
  /* 自車は**画面のちょうど中心**。地図のほうが動く。 */
  g.save();
  g.shadowColor = 'rgba(0,0,0,.55)'; g.shadowBlur = 6;
  g.fillStyle = '#fff';
  g.beginPath(); g.arc(w / 2, h / 2, 8, 0, Math.PI * 2); g.fill();
  g.fillStyle = css('--accent') || '#4a9eff';
  g.beginPath(); g.arc(w / 2, h / 2, 5.5, 0, Math.PI * 2); g.fill();
  g.restore();

  const pad = R + 20;
  g.save();
  g.shadowColor = 'rgba(0,0,0,.75)'; g.shadowBlur = 6;
  arc(pad, h - pad, r.rpm, 10000, '回転数', 'rpm');
  arc(w - pad, h - pad, r.spdTrue, 140, '車速', 'km/h');
  g.restore();

  /* ギヤは左上。コントロールを右上へ逃がしてあるので空いている。
   * 地図は明暗どちらにもなるので、暗い角丸を敷いたうえで文字にも縁を付ける。 */
  const gs = r.gear ? String(r.gear) : (r.gstate === 'slow' ? '–' : '?');
  // 見出しと数字が触れないよう縦を広めに取る
  const gr = R * 1.15, bw = gr * 1.55, bh = gr * 1.85;
  const bx = 10 + bw / 2, by = 10 + bh / 2;
  g.save();
  g.fillStyle = 'rgba(16,20,26,.62)';
  g.beginPath(); g.roundRect(bx - bw / 2, by - bh / 2, bw, bh, gr * 0.28); g.fill();
  g.strokeStyle = 'rgba(255,255,255,.28)'; g.lineWidth = 1.5; g.stroke();
  g.textAlign = 'center';
  g.font = `700 ${gr}px ui-monospace,monospace`;
  g.lineWidth = Math.max(3, gr * 0.14); g.lineJoin = 'round';
  g.strokeStyle = 'rgba(0,0,0,.85)';
  g.strokeText(gs, bx, by + gr * 0.46);          // 縁取りしてから塗る
  g.fillStyle = '#fff';
  g.fillText(gs, bx, by + gr * 0.46);
  g.font = `600 ${gr * 0.26}px system-ui,sans-serif`;
  g.lineWidth = Math.max(2, gr * 0.09);
  g.strokeText('GEAR', bx, by - bh / 2 + gr * 0.30);
  g.fillStyle = 'rgba(255,255,255,.82)';
  g.fillText('GEAR', bx, by - bh / 2 + gr * 0.30);
  g.restore();
}

/* 表示の基準時刻。再生中は `playT`、それ以外は選んだ行の時刻。
 * **行にスナップさせず連続時刻で持つ**ことで、自車を計測点の間に置ける。 */
let viewT = null;

/* ── 自車位置の内挿 ──────────────────────────────────────
 *
 * **GPS は行の半分の頻度でしか更新されない。** 実測（2026-09-05 のログ）では
 * 行が 0.67 秒間隔なのに GPS の更新は 1.30 秒間隔で、走行中の隣接行の 33.4%
 * が座標まったく同一だった。行どうしを直に結んで内挿すると、**同じ座標の
 * 2 行の間は動かず、次で 2 倍動く**。これが再生時の段付きの正体。
 *
 * そこで**座標が変わった点だけを節点**として取り出し（`path`）、節点の間を
 * 車速の積分で配分する。節点の間隔は 1.3 秒になるが、止まって飛ぶ動きは消える。
 *
 * 節点の時刻には**その座標が最初に現れた行の時刻**を使う。アプリは最新の測位を
 * 各行へ写しているので、新しい座標が現れた行がその測位に最も近い。
 *
 * 配分を時間比でなく車速で行うのは、欠測やトンネル補完で間隔が空いたところを
 * 実際の移動に合わせるため。区間の速度が線形に変わるとみなすと、経過 τ までに
 * 進む距離は `v0·τ + (v1-v0)·τ²/(2Δ)`。これを積算しておく（`cumS`）。
 *
 * **節点の間は直線ではなく Catmull-Rom で結ぶ。** 節点を折れ線で結ぶと、
 * 進行方向が節点ごとに飛ぶ。実測で折れ角は中央 1.3°・90% 点 5.1°・最大 38.8°
 * あり、50km/h 超でも 90% 点 3.5°（節点間 18m として横に約 1m）。歩幅の急変より
 * 1 桁大きく、ここが滑らかさの律速になっている。
 *
 * 媒介変数は **centripetal（α=0.5）**。節点の間隔は車速で変わるので、一様
 * パラメータ版だとカスプや行き過ぎが出る。α=0.5 はそれが起きないことが
 * 証明されている。節点そのものは通るので、位置がずれるわけではない。
 *
 * なお段付きの原因として車速の量子化と GPS の位置ノイズも当たったが、いずれも
 * 説明にならない。車速 1km/h 刻みは 1 区間あたり ±0.11m（縮尺 17 で 0.11 画素）、
 * GPS の横ばらつきは中央 0.00m・90% 点 0.41m しかない。
 */

/** 時刻 `t` を挟む 2 行と、その間の比率を返す。方位と車速積分で共用する。 */
function bracketAtT(t) {
  if (!rows.length) return null;
  let lo = 0, hi = rows.length - 1;
  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (rows[m].t <= t) lo = m; else hi = m; }
  const a = rows[lo], b = rows[hi];
  const d = b.t - a.t;
  if (d <= 0) return {lo, hi, k: 0};
  const tau = Math.max(0, Math.min(d, t - a.t));
  const v0 = a.spdTrue ?? 0, v1 = b.spdTrue ?? v0;
  const total = (v0 + v1) / 2 * d;
  const f = total > 0 ? (v0 * tau + (v1 - v0) * tau * tau / (2 * d)) / total : tau / d;
  return {lo, hi, k: Math.max(0, Math.min(1, f))};
}

let path = [];     // 座標が変わった点だけ {t, ll, est, dk}
let cumS = [];     // 行ごとの、先頭からの車速積分 [m]

const CR_ALPHA = 0.5;      // centripetal Catmull-Rom

function buildPath() {
  path = [];
  let last = null;
  for (const r of rows) {
    const p = markerPos(r);
    if (!p) continue;
    if (last && p.ll[0] === last[0] && p.ll[1] === last[1]) continue;
    path.push({t: r.t, ll: p.ll, est: p.est});
    last = p.ll;
  }
  // knot 間隔は節点間の距離^α。毎フレーム測り直さない
  for (let i = 0; i < path.length - 1; i++) {
    const a = path[i].ll, b = path[i + 1].ll;
    path[i].dk = Math.pow(havM(a[0], a[1], b[0], b[1]), CR_ALPHA) || 1e-6;
  }
  cumS = new Array(rows.length).fill(0);
  for (let i = 1; i < rows.length; i++) {
    const dt = rows[i].t - rows[i - 1].t;
    const v0 = (rows[i - 1].spdTrue ?? 0) / 3.6, v1 = (rows[i].spdTrue ?? 0) / 3.6;
    cumS[i] = cumS[i - 1] + (dt > 0 ? (v0 + v1) / 2 * dt : 0);
  }
}

/** 時刻 `t` までに車速から積算した距離 [m]。行の中は 2 次で内挿する。 */
function sAtT(t) {
  const br = bracketAtT(t);
  if (!br || !cumS.length) return 0;
  const a = rows[br.lo], b = rows[br.hi];
  const d = b.t - a.t;
  if (d <= 0) return cumS[br.lo];
  const tau = Math.max(0, Math.min(d, t - a.t));
  const v0 = (a.spdTrue ?? 0) / 3.6, v1 = (b.spdTrue ?? 0) / 3.6;
  return cumS[br.lo] + v0 * tau + (v1 - v0) * tau * tau / (2 * d);
}

/**
 * `p1`〜`p2` の区間を、両隣を含む 4 点の Catmull-Rom で評価する（Barry-Goldman）。
 * `d0`/`d1`/`d2` は 3 区間の knot 間隔、`u` は `p1`→`p2` の 0〜1。
 *
 * 緯度と経度を別々に評価してよい。knot を距離から作ってあるので、これは
 * メートル空間で引いた曲線を度へ写したものと一致する。
 */
function crEval(p0, p1, p2, p3, d0, d1, d2, u) {
  const t1 = d0, t2 = t1 + d1, t = t1 + u * d1;
  const mix = (a, b, ta, tb) => {
    const w = tb > ta ? (t - ta) / (tb - ta) : 0;
    return [a[0] + (b[0] - a[0]) * w, a[1] + (b[1] - a[1]) * w];
  };
  const A1 = mix(p0, p1, 0, t1), A2 = mix(p1, p2, t1, t2), A3 = mix(p2, p3, t2, t2 + d2);
  return mix(mix(A1, A2, 0, t2), mix(A2, A3, t1, t2 + d2), t1, t2);
}

function posAtT(t) {
  if (!path.length) return null;
  let lo = 0, hi = path.length - 1;
  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (path[m].t <= t) lo = m; else hi = m; }
  const a = path[lo], b = path[hi];
  if (b.t <= a.t) return {ll: a.ll, est: a.est};
  const tt = Math.max(a.t, Math.min(b.t, t));
  const sa = sAtT(a.t), sb = sAtT(b.t);
  // 停車中は積分が伸びないので、そのときだけ時間で配る
  const k = sb > sa ? (sAtT(tt) - sa) / (sb - sa) : (tt - a.t) / (b.t - a.t);
  const kk = Math.max(0, Math.min(1, k));
  // 端では隣が無いので点を鏡像で作る。knot 間隔も同じ幅を折り返す
  const mir = (q, r) => [2 * q[0] - r[0], 2 * q[1] - r[1]];
  const last = path.length - 1;
  const p0 = lo > 0 ? path[lo - 1].ll : mir(a.ll, b.ll);
  const p3 = hi < last ? path[hi + 1].ll : mir(b.ll, a.ll);
  const d1 = a.dk || 1e-6;
  const d0 = lo > 0 ? (path[lo - 1].dk || d1) : d1;
  const d2 = hi < last ? (path[hi].dk || d1) : d1;
  return {ll: crEval(p0, a.ll, b.ll, p3, d0, d1, d2, kk), est: a.est || b.est};
}

function setCursor(i) {
  cursor = i;
  const r = i >= 0 ? rows[i] : null;
  const [t0, t1] = tSpan();
  $('cur').textContent = r
    ? `${mmss(r.t - t0)} / ${mmss(t1 - t0)} (${r.t.toFixed(0)}s)` : '';
  for (const s of SERIES) {
    const el = $('v_' + s.key);
    const v = r ? r[s.key] : null;
    el.textContent = v == null ? '--' : (+v).toFixed(s.fix) + (s.unit ? ' ' + s.unit : '');
  }
  // 位置だけは行にスナップさせず、連続時刻から内挿する
  const mp = r ? (posAtT(viewT != null ? viewT : r.t) || markerPos(r)) : null;
  /* 補完区間でも見た目は変えない。**マーカーの仕事は「いまどこか」を示すこと**で、
   * 視認性を落とすのは役割と衝突する。位置が推定であることは、その場所に引かれた
   * 破線が既に示している（一度 fillOpacity を落としたが、追いかけにくくなった）。 */
  /* ナビ中は地図上のマーカーを消す。**自車はオーバーレイの中心に固定で描く**ので、
   * 地図側にも置くと Leaflet の丸め誤差ぶんだけ二重にブレる。 */
  if (marker && mp && !navOn) marker.setLatLng(mp.ll), marker.setStyle({opacity:1, fillOpacity:1});
  else if (marker) { if (mp) marker.setLatLng(mp.ll); marker.setStyle({opacity:0, fillOpacity:0}); }
  navApply(i, false);
  drawCharts();
}

// ── 表（色だけに頼らないための代替表現）───────────────────

// ── 更新 ─────────────────────────────────────────────────
function refresh() {
  chartEpoch++;          // 系列が変わりうるので背景キャッシュを捨てる
  const tol = +$('tol').value;
  // 窓だけは判断の余地があるので走行画面と localStorage で共有する
  if (isFinite(tol) && tol > 0) localStorage.setItem('mc52_tol', String(tol));
  assignGears(GEAR_K, tol);
  // 地図側の失敗でチャートを巻き込まない
  try { drawMap(); buildPath(); computeHeadings(); } catch (e) { console.warn('map:', e); }
  drawCharts();
  const n = rows.length;
  const gps = rows.filter(r => r.lat != null).length;
  const known = rows.filter(r => r.gear).length;
  const rat = rows.filter(r => r.ratio != null).length;
  const dur = n ? (rows[n-1].t - rows[0].t) : 0;
  const al = rows.length && rows[0].hasSkew ? 'skew列' : '周期推定';
  $('stat').textContent = `${n} 行 / ${(dur/60).toFixed(1)} 分 / GPS ${gps} 点 / `
    + `ギヤ確定 ${rat ? (known/rat*100).toFixed(0) : 0}%`
    + ($('align').checked ? ` (時刻補正: ${al})` : ' (補正なし)')
    + (speedCorr() !== 1 ? ` / 車速 ×${speedCorr().toFixed(4)}` : '')
    + (rows.badFixes ? ` / 精度不良で除外 ${rows.badFixes} 点` : '');
}

/** 補完の結果を状態行へ足す。落ちた区間は理由ごと出す（黙って消さない）。 */
function statFills(base) {
  const n = fills.length;
  const ng = (fills.notes || []).length;
  const km = fills.reduce((a, f) => a + f.km, 0);
  const err = n ? Math.max(...fills.map(f => Math.abs(f.errPct))) : 0;
  const st8 = fills.filter(f => f.straight).length;
  $('stat').textContent = base
    + (n ? ` / 途絶を補完 ${n} 区間 ${km.toFixed(2)}km（乖離 最大 ${err.toFixed(1)}%`
           + (st8 ? `、うち直線 ${st8}` : '') + '）' : '')
    + (ng ? ` / 補完できず ${ng} 区間` : '');
  if (ng) console.warn('[補完できず]', fills.notes);
}

$('file').onchange = e => {
  const f = e.target.files[0];
  if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try {
      rows = parseCsv(rd.result);
      drawMap._fitted = false;   // 新しいログを読んだら範囲を取り直す
      computeRatios();           // fitK は比を見るので先に用意する
      $('estsp').disabled = false;
      $('calsp').disabled = false;
      $('pNav').disabled = false;
      for (const id of ['pPlay', 'pBack', 'pFwd']) $(id).disabled = false;
      playT = rows[0].t; setPlay(false);
      showKDiag();
      // **丁数の自動推定より先にキャンバスを作る。** 推定は onSprk 経由で
      // refresh を呼ぶので、後に置くと描画対象が無いまま走る
      buildCharts();
      // 一度も設定していなければ自動で入れる。設定済みなら勝手に上書きしない
      if (localStorage.getItem('mc52_sf') == null) applyEstimate(true);
      refresh();
      // 経路探索は外部サービスなので、地図を出してから非同期で足す。
      // 失敗しても既に描いたものは残る
      const base = $('stat').textContent;
      if (findFillGaps().length) {
        $('stat').textContent = base + ' / 測位途絶を補完中…';
        fillGaps().then(() => { drawMap(); statFills(base); })
                  .catch(e => { $('stat').textContent = base + ' / 補完に失敗: ' + e.message; });
      }
    } catch (err) {
      $('stat').textContent = '読み込み失敗: ' + err.message;
    }
  };
  rd.readAsText(f);
};
/* k は固定だが、ログから当てた値を併記する。両者が離れていれば前提のどこかが
 * 崩れている合図になる（`0D` の切り捨てを見つけたのはこの比較だった）。 */
function showKDiag() {
  const k = fitK();
  $('kdiag').textContent = k
    ? `k ${GEAR_K.toFixed(4)}（このログ ${k.toFixed(4)}${
        Math.abs(k / GEAR_K - 1) > 0.005 ? ' ⚠' : ''}）`
    : `k ${GEAR_K.toFixed(4)}`;
}
// 上限を超えると隣の段に食い込むので、入力を受け付ける段階で丸める
$('ver').textContent = VERSION;
$('tol').max = TOL_MAX.toFixed(1);
$('tolMax').textContent = `(上限 ${TOL_MAX.toFixed(1)})`;
$('tol').oninput = () => {
  const v = parseFloat($('tol').value);
  if (isFinite(v) && v > TOL_MAX) $('tol').value = TOL_MAX.toFixed(1);
  refresh();
};
// 補正を切り替えたら k も取り直す。比の系列そのものが変わるため
// 選択肢は探索範囲と同じ定義から作る（片方だけ直して食い違うのを防ぐ）
function fillTeeth(el, range, stock, saved) {
  el.innerHTML = '';
  for (let n = range[0]; n <= range[1]; n++) {
    const o = document.createElement('option');
    o.value = n; o.textContent = n + (n === stock ? 'T(純正)' : 'T');
    el.appendChild(o);
  }
  el.value = saved;
}
fillTeeth($('sf'), FRONT_RANGE, STOCK_FRONT, parseInt(localStorage.getItem('mc52_sf'), 10) || STOCK_FRONT);
const onSprk = () => {
  localStorage.setItem('mc52_sf', String(sprkFront()));
  refresh();   // 比は生値のままなので k の取り直しは不要
};
$('sf').onchange = onSprk;

function applyEstimate(quiet) {
  const e = estimateSprocket();
  if (!e) { if (!quiet) $('stat').textContent = 'GPS 速度が足りず丁数を推定できない'; return; }
  const top = e.cand[0];
  $('sf').value = top.front;
  onSprk();
  const second = e.cand[1];
  $('stat').textContent =
    `前丁数 ${top.front}T（誤差 ${(top.err * 100).toFixed(2)}% / 実測係数 ${e.c.toFixed(4)}`
    + ` / GPS ${e.n} 点）` + (second ? ` — 次点 ${second.front}T (${(second.err * 100).toFixed(2)}%)` : '');
}
$('estsp').onclick = () => applyEstimate(false);

/**
 * 表示車速が GPS と一致するよう校正トリムを求めて保存する。
 *
 * 丁数比は諸元から決まるが、実測の `0D`/GPS はそれより約 0.9% 高い。ECU の
 * 想定円周が実際の転がり円周より大きいためで、タイヤの摩耗・空気圧で動く。
 * ギヤ判定の `k` と違って**較正すべき自由度が実在する**ので、ここは実測に合わせる。
 *
 * **45km/h 未満は使わない。** `0D` の 1km/h 量子化と GPS 側のノイズで比が上へ
 * 跳ねる（実測で 15-29km/h 帯は 0.967、45km/h 以上は 0.940 で平ら）。
 */
function calibrateSpeed() {
  let so = 0, sg = 0, n = 0;
  for (const r of rows) {
    if (r.spd == null || r.gspd == null || r.acc == null) continue;
    if (r.gspd < 45 || r.acc > 15) continue;
    so += spdTrue(r.spd); sg += r.gspd; n++;
  }
  if (n < 300) { $('stat').textContent = `45km/h 以上の GPS が ${n} 点しかなく校正できない`; return; }
  // 表示 = spdTrue × (丁数比 × トリム) が GPS に一致するトリム
  const trim = sg / so / (sprkFront() / STOCK_FRONT);
  if (!(trim > 0.8 && trim < 1.25)) { $('stat').textContent = `校正値 ${trim.toFixed(4)} が想定外。保存しない`; return; }
  try { localStorage.setItem(TRIM_KEY, String(trim)); } catch {}
  refresh();
  $('stat').textContent =
    `車速校正 ${trim.toFixed(4)}（表示係数 ${(sprkFront() / STOCK_FRONT * trim).toFixed(4)}`
    + ` / 丁数比のみなら ${(sprkFront() / STOCK_FRONT).toFixed(4)} / GPS ${n} 点）`;
}
$('calsp').onclick = calibrateSpeed;

$('pNav').onclick = () => setNav(!navOn);
$('nvOff').onclick = () => setNav(false);
$('nvIn').onclick  = () => { map.zoomIn();  navApply(cursor, true); };
$('nvOut').onclick = () => { map.zoomOut(); navApply(cursor, true); };

$('align').onchange = () => { computeRatios(); showKDiag(); refresh(); };
const OPTS_KEY = 'mc52_opts';
function setOpts(open) {
  $('opts').hidden = !open;
  $('optBtn').classList.toggle('on', open);
  try { localStorage.setItem(OPTS_KEY, open ? '1' : '0'); } catch {}
  // 高さが変わるので地図と時系列を追随させる
  if (map) map.invalidateSize();
  drawCharts();
}
$('optBtn').onclick = () => setOpts($('opts').hidden);
try { if (localStorage.getItem(OPTS_KEY) === '1') setOpts(true); } catch {}

addEventListener('resize', () => {
  drawCharts();
  if (map) map.invalidateSize();
  if (navOn) navApply(cursor, true);
});
</script>
